- aid: docusign:docusign-signinggroups-api
  name: Docusign SigningGroups API
  description: "The SigningGroups resource provides methods that allow you manage signing groups.\n\n\
    Signing Groups allow you to create a group of people to which an envelope is sent. Any member of that\
    \ group can open an envelope and sign the documents in the envelope with their own signature, even\
    \ though a signature field was not directly assigned to them. When the Signing Group option is used,\
    \ group members that open and sign the envelope are tracked in the envelope history and certificate.\n\
    \nWhen one group member opens the envelope, it is temporarily locked and if other members try to open\
    \ the envelope they will see a message saying the envelope is currently opened. If the group member\
    \ exits the envelope without finishing the lock expires, allowing other group members to open and\
    \ complete the envelope.\n\nWhen the envelope is complete, all members of the group will receive a\
    \ completed notification and can access the completed envelope. \nThe envelope history and Certificate\
    \ of Completion will show that the envelope was sent to a signing group and record which members viewed\
    \ and signed the envelope.\n\nAn account can have a maximum of 50 signing groups. Each signing group\
    \ can have a maximum of 50 group members.\n\nThe Signing Groups feature is only supported in certain\
    \ DocuSign Enterprise and System Automated Premium plans. Your account might not support this option.\
    \ To access this functionality, contact your Account Manager or DocuSign Support (support@docusign.com)\
    \ for assistance."
  humanURL: https://developers.docusign.com/docs/esign-rest-api/
  baseURL: https://demo.docusign.net/restapi
