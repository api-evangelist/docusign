    ## Agents Recipient


    An agent recipient can add name and email information for recipients that appear after the agent in
    routing order.


    In addition to the [core parameters](#core-recipient-parameters),

    this type adds the following parameters.


    <br>


    | Name | Required | Schema Type | Description |

    | :--- | :--- | :--- | :--- |

    | canEditRecipientEmails | No | Boolean | Optional element. When set to **true**, the Agents Recipient
    associated with this Recipient can change the Recipient's pre-populated Email address. This element
    is only active if enabled for the account. |

    | canEditRecipientNames | No | Boolean | Optional element. When set to **true**, the Agents Recipient
    associated with this recipient can change the recipient's pre-populated name (`UserName`). This element
    is only active if enabled for the account. |


    <br>


    **JSON layout**


    ```

    "agents": [{
     <core parameters>
      "canEditRecipientEmails": false,
      "canEditRecipientNames": false
    }],

    ```



    ## Carbon Copies Recipient


    Carbon copy recipients get a copy of the envelope but don't need to sign, initial, date or add information
    to any of the documents. This type of recipient can be used in any routing order. Carbon copy recipients
    receive their copy of the envelope when the envelope reaches the recipient's order in the process
    flow and when the envelope is completed.


    This recipient type uses only the [core parameters](#core-recipient-parameters).


    **JSON layout**


    ```

    "carbonCopies": [{
     <core parameters>
    ```



    ## Certified Deliveries Recipient


    Certified delivery recipients must receive the completed documents for the envelope to be completed.
    However, they don't need to sign, initial, date or add information to any of the documents.


    This recipient type uses only the [core parameters](#core-recipient-parameters).


    **JSON layout**


    ```

    "certifiedDeliveries": [{

    <core parameters>

    }],

    ```


    ## Editors Recipient


    Editors have the same management and access rights for the envelope as the sender. They can make changes
    to the envelope as if they were using the Advanced Correct feature. This recipient can add name and
    email information, add or change the routing order and set authentication options for the remaining
    recipients. Additionally, this recipient can edit signature/initial tabs and data fields for the remaining
    recipients. The recipient must have a DocuSign account to be an editor.


    In addition to the [core parameters](#core-recipient-parameters),

    this type adds the following parameters.


    <br>


    | Name | Required | Schema Type | Description |

    | :--- | :--- | :--- | :--- |

    | canEditRecipientEmails | No | Boolean | Optional element. When set to **true**, the Editors Recipient
    associated with this Recipient can change the Recipient's pre-populated Email address. This element
    is only active if enabled for the account. |

    | canEditRecipientNames | No | Boolean | Optional element. When set to **true**, the Editors Recipient
    associated with this recipient can change the recipient's pre-populated name (`UserName`). This element
    is only active if enabled for the account. |


    <br>



    **JSON layout**


    ```

    "editors": [{
     <core parameters>
      "canEditRecipientEmails": false,
      "canEditRecipientNames": false
    }],

    ```



    ## In-Person Signers Recipient


    An in-person recipient is a DocuSign user,

    acting as a Signing Host,

    who is in the same physical location as the signer.


    In addition to the [core parameters](#core-recipient-parameters),

    this type adds the following parameters.


    The following restrictions apply

    to using electronic notary when sending documents:


    * Authentication methods are allowed for the signer but not the notary.

    * The Sign On Paper, Document Markup, Field Markup and Change Signer options cannot be used for the
    documents.

    * Tabs may be assigned to the signer, but cannot be assigned to the notary.


    Refer to [eNotary Resources][enotary-resources]

    in the DocuSign Support Center for more information

    about how the eNotary feature works.


    <br>


    | Name                | Required                                                          | Schema
    Type | Description                                                                                                                                                                                                                                                                                                                            |

    | :------------------ | :---------------------------------------------------------------- | :----------
    | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
    |

    | inPersonSigningType | No                                                                | String      |
    Specifies whether the envelope uses the eNotary feature. The accepted values are:<ul markdown=1><li>`inPersonSigner`
    The envelope uses the normal in-person signing flow.</li><li>`notary`: The envelope uses the eNotary
    signing flow.</li></ul>                                                                                      |

    | notaryHost          | Yes, when `inPersonSigningType` is `notary`                       | NotaryHost  |
    Sets the information for the notary host for the notary in person signing flow. The following information
    is required: <ul markdown=1> <li>`recipientId`: A unique ID number for the notary signing host. </li>
    <li>`name`: Specifies the notary's full legal name.</li> <li>`email`: Specifies the notary's email
    address. </li> </ul>|

    | autoNavigation      | No                                                                | Boolean     |
    Specifies whether auto navigation is set for the recipient.                                                                                                                                                                                                                                                                            |

    | defaultRecipient    | No                                                                | Boolean     |
    When set to **true**, this is the default recipient for the envelope. This option is used when creating
    an envelope from a template.                                                                                                                                                                                                   |

    | hostName            | Yes, when `inPersonSigningType` is `inPersonSigner`               | String      |
    The name of the signing host. This is the DocuSign user that is hosting the in-person signing session.                                                                                                                                                                                                                                 |

    | hostEmail           | Yes, when `inPersonSigningType` is `inPersonSigner`               | String      |
    The email address of the signing host. This is the DocuSign user that is hosting the in-person signing
    session.                                                                                                                                                                                                                        |

    | signerName          | Yes, when `inPersonSigningType` is `inPersonSigner`               | String      |
    The in-person signer's full legal name.                                                                                                                                                                                                                                                                                                |

    | signerEmail         | No, but valid only when `inPersonSigningType` is `inPersonSigner` | String      |
    The in-person signer's email address.                                                                                                                                                                                                                                                                                                  |

    | name                | Yes, when `inPersonSigningType` is `notary`                       | String      |
    The full legal name of the signer in an eNotary flow.                                                                                                                                                                                                                                                                                  |

    | email               | Yes, when `inPersonSigningType` is `notary`                       | String      |
    The signer's email address in an eNotary flow.                                                                                                                                                                                                                                                                                         |

    | signatureInfo       | No                                                                | String      |
    Optional element only used with recipient types In Person Signers and Signers.<br/><br/>Allows the
    sender to pre-specify the signature name, signature initials, and signature font used in the signature
    stamp for the recipient.                                                                                                     |

    | signInEachLocation  | No                                                                | Boolean     |
    When set to **true** and the feature is enabled in the sender's account, the signing recipient is
    required to draw signatures and initials at each signature/initial tab (instead of adopting a signature/initial
    style or only drawing a signature/initial once).                                                                     |

    | tabs                | No                                                                | Tab         |
    Optional element only used with recipient types In Person Signers and Signers.<br/><br/>Specifies
    the Tabs associated with the recipient. See the [EnvelopeRecipientTabs resource][envelopeRecipientTabsResource]
    for more information about tabs.                                                                                     |


    <br>


    **JSON layout**


    ```

    "inPersonSigners": [{
      "hostEmail": "signing.host@company.com",
      "hostName": "Mike Host",
     <core parameters>
      "autoNavigation": false,
      "defaultRecipient": false,
      "signInEachLocation": false,
      "signatureInfo": null,
      "signerEmail": "inperson.signer@company.com",
      "signerName": "Isaac Inperson",
      "email": "notary.signer@example.com",
      "name": "Notary Signer"
      "tabs": {
        "approveTabs": null,
        "checkboxTabs": null,
        "companyTabs": null,
        "dateSignedTabs": null,
        "dateTabs": null,
        "declineTabs": null,
        "emailTabs": null,
        "envelopeIdTabs": null,
        "fullNameTabs": null,
        "initialHereTabs": null,
        "listTabs": null,
        "noteTabs": null,
        "numberTabs": null,
        "radioGroupTabs": null,
        "signHereTabs": [{
        "signerAttachmentTabs": null,
        "ssnTabs": null,
        "textTabs": null,
        "titleTabs": null,
        "zipTabs": null
      }
      "inPersonSigningType": "notary",
      "notaryHost": {
        "email": "notary@example.com",
        "name": "Natalie Notary",
        "recipientId": "string"
      }
    }],

    ```



    ## Intermediaries Recipient


    An intermediary is a recipient who can, but is not required to, add name and email information for
    recipients at the same or subsequent level in the routing order, unless subsequent agents, editors
    or intermediaries are added.


    In addition to the [core parameters](#core-recipient-parameters),

    this type adds the following parameters.


    <br>


    | Name | Required | Schema Type | Description |

    | :--- | :--- | :--- | :--- |

    | canEditRecipientEmails | No | Boolean | Optional element. When set to **true**, the Agents Recipient
    associated with this Recipient can change the Recipient's pre-populated Email address. This element
    is only active if enabled for the account. |

    | canEditRecipientNames | No | Boolean | Optional element. When set to **true**, the Agents Recipient
    associated with this recipient can change the recipient's pre-populated name (`UserName`). This element
    is only active if enabled for the account. |


    <br>


    **JSON layout**


    ```

    "intermediaries": [{

    <core parameters>
      "canEditRecipientEmails": false,
      "canEditRecipientNames": false
    }],

    ```




    ## Seals Recipient


    An electronic seal recipient is not a natural but a legal person. Electronic Seals can be used by
    organizations and governments to show evidence of origin and integrity of documents.

    Even though electronic seals can be represented by a tab in a document, they do not require user interaction
    and apply automatically in the order specified by the sender. The sender is therefore the person authorizing
    usage of the electronic seal in the flow.

    Electronic seal recipients rely on a subset of core properties. They also add a new `recipientSignatureProviders`
    parameter.



    <br>



    | Name&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; | Required&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    | Schema Type&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; | Description&nbsp;&nbsp;&nbsp;&nbsp; |

    | :--- | :--- | :--- | :--- |

    | recipientId| Yes | String | Indicates the unique ID of the applied electronic seal.<br/>|

    | routingOrder| No (default: 1) | String | Specifies the routing order of the electronic seal in the
    envelope. <br />The routing order assigned to your electronic seal cannot be shared with another recipient.
    It is recommended that you set a routing order for your electronic seals.. |

    | recipientSignatureProviders| Yes | String | Indicates which electronic seal to apply on documents
    when creating an envelope. |


    By default, Electronic Seals apply on all documents in an envelope. However, the sealDocumentsWithTabsOnly
    property (see recipientSignatureProvider) allows you to seal only documents that have signHere tabs
    set for the Electronic Seal recipients.




    **JSON layout (Apply Electronic Seals on all documents)**

    ```

    {
            ....

            "recipients": {
              "seals": [            {
                  "recipientId": "10",
                  "routingOrder" : 2,
                  "recipientSignatureProviders": [{
                      "sealName": "ed8f186c-3b12-45cb-9eb3-c8c33dc4f6b0",
                      "sealDocumentsWithTabsOnly": "false"
                    }]
                }]
            },
            "documents": [
                {
                    "documentId": "55",
                    "name": " ACME Contract",
                    "fileExtension": "pdf",
                    "documentBase64": "DOC_IN_BASE64"
                }
            ]
    }

    ```




    **JSON layout (Apply Electronic Seals on specific documents)**

    ```

    {
            ....

            "recipients": {
              "seals": [{
                  "recipientId": "10",
                  "routingOrder" : 2,
                  "recipientSignatureProviders": [{
                      "sealName": "ed8f186c-3b12-45cb-9eb3-c8c33dc4f6b0",
                      "sealDocumentsWithTabsOnly": "true"
                    }],
                   "tabs": {
                        "signHereTabs": [{
                                "documentId": "55",
                                "recipientId": "10",
                                "pageNumber": "1",
                                "xPosition": "272",
                                "yPosition": "98",
                            }]
                    }
                }]
            },
            "documents": [{
                    "documentId": "55",
                    "name": " ACME Contract",
                    "fileExtension": "pdf",
                    "documentBase64": "DOC_EN_BASE64"
                }]
    }

    ```





    ## Signers Recipient


    A signer is a recipient who must sign, initial, date, or add data to form fields on the documents
    in the envelope.


    In addition to the [core parameters](#core-recipient-parameters),

    this type adds the following parameters.


    <br>



    | Name | Required | Schema Type | Description |

    | :--- | :--- | :--- | :--- |

    | autoNavigation | No | Boolean | Specifies whether auto navigation is set for the recipient.|

    | defaultRecipient | No | Boolean | When set to **true**, this is the default recipient for the envelope.
    This option is used with the CreateEnvelopeFromTemplatesAndForms method. |

    | signInEachLocation | No | Boolean | When set to **true** and the feature is enabled in the sender's
    account, the signing recipient is required to draw signatures and initials at each signature/initial
    tab (instead of adopting a signature/initial style or only drawing a signature/initial once). |

    | signatureInfo | No | String | Optional element only used with recipient types In Person Signers
    and Signers.<br/><br/>Allows the sender to pre-specify the signature name, signature initials, and
    signature font used in the signature stamp for the recipient. |

    | signerEmail | No | String | Optional element. The email address for an InPersonSigner recipient
    Type.<br/>Maximum Length: 100 characters. |

    | signerName | Yes | String | Required element with recipient type In Person Signers.<br/>Maximum
    Length: 100 characters.<br/><br/>The full legal name of a signer for the envelope. |

    | tabs | No | Tab | Optional element only used with recipient types In Person Signers and Signers.<br/><br/>Specifies
    the Tabs associated with the recipient. See the the [EnvelopeTabs resource][envelopeTabsResource]  for
    more information about tabs. |

    | deliveryMethod | No | String | Reserved for DocuSign.|

    | deliveredDateTime | No | DateTime | Reserved for DocuSign. |

    | signedDateTime | No | DateTime | Reserved for DocuSign. |

    | offlineAttributes | No | &nbsp; | Reserved for DocuSign.|


    <br>


    **JSON layout**


