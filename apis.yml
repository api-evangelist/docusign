- aid: docusign:docusign-formgroups-api
  name: Docusign FormGroups API
  description: >-
    With the appropriate permissions, form administrators at your company can create form groups, or curated
    set of forms gathered from the association **form libraries** to which DocuSign provides access. Form
    groups enable agents to know which forms to add to rooms based on the type of transaction they are
    working on. When creating groups, administrators can make certain forms required, ensuring compliance.
    If you don't create groups, agents will have to choose forms they need from a list of association
    forms.
