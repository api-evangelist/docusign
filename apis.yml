  name: Docusign CustomTabs API
  description: >-
    The CustomTabs resource provides methods that allow you create and manage custom tabs based on the
    existing DocuSign tabs.


    You can create a tab with pre-defined properties, such as a text tab with a certain font type and
    validation pattern. Users can access the custom tabs when sending documents through the DocuSign web
    application.


    Custom tabs can be created based on the  approve, checkbox, company, date, date signed, decline, email,
    email address, envelope ID, first name, formula, full name, initial here, last name, list, note, number,
    radio, sign here, signer attachment, SSN, text, title, and zip tabs.
