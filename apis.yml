- aid: docusign:docusign-templatecustomfields-api
  name: Docusign TemplateCustomFields API
  description: "The TemplateCustomFields resource provides methods that allow you manage custom fields\
    \ in an template. \n\nCustom fields can be used in the templates for your account to record information\
    \ about the template, help search for templates and track information. The template custom fields\
    \ are shown in the Template Settings section when a user is creating an template in the DocuSign member\
    \ console. The template custom fields are not seen by the template recipients.\n\nThere are two types\
    \ of template custom fields, text and list. A text custom field lets the sender enter the value for\
    \ the field. With a list custom field, the sender selects the value of the field from a pre-made list."
