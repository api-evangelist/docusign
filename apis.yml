- aid: docusign:docusign-roles-api
  name: Docusign Roles API
  description: >-
    Each role is associated with specific permissions. Each new member is assigned a role when you create
    them, automatically granting them the permissions associated with that role.


    Roles use the following permission types to control the actions that users can perform:


    - Room

    - Room Details

    - Documents

    - Envelopes

    - Member Management

    - Company Settings


    Rooms enables you to configure custom roles containing permissions that make sense for your company.
    Because each new member is assigned a role, you must set up these roles before you can invite members
    to join your account.


    Permissions for roles are tied to the `roleId` property and not yet exposed. You can learn more about
    these permission types and configure them in the console.


    ### Internal and External Roles


    In Rooms, a role can be either internal or external. You assign internal roles to people inside your
    company. You assign external roles to people outside your company when you invite them to a room.


    Each member inside your company has a default company role. However, they can also be assigned additional
    roles with different permissions on a per-room basis. Regardless of the member's default company role,
    what they can do in a room is entirely controlled by their role in that particular room.
  humanURL: https://developers.docusign.com/docs/esign-rest-api/
  baseURL: https://demo.docusign.net/restapi
