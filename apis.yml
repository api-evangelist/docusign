    type: Documentation
  - url: https://developers.docusign.com/docs/navigator-api/concepts/
    type: GettingStarted
  - url: https://developers.docusign.com/docs/navigator-api/how-to/
    type: Tutorials
  description: >-
    The Docusign Navigator API offers developers access to AI-extracted data from the Navigator smart
    agreement repository. It provides capabilities to analyze existing agreements, extract insights, and
    connect agreement data to business systems, enabling bulk ingestion of documents and retrieval of
    AI-analyzed agreement information.
- aid: docusign:docusign-workspaces-api
  name: Docusign Workspaces API
  tags:
  - Agreements
  - Collaboration
  - Workspaces
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://demo.docusign.net/restapi
