- aid: docusign:docusign-enveloperecipienttabs-api
  name: Docusign EnvelopeRecipientTabs API
  description: "<!-- resources aren't rendered the same way\n     as other pages. This is a little hack\
    \ to\n     make the headings work better -->\n<style>\nh1, h2, h3 {\n  margin-top: 1em;\n}\n</style>\n\
    \nThe EnvelopeRecipientTabs resource provides methods that let you\nadd,\nupdate,\nand delete tabs\n\
    from an envelope.\nTabs are associated with a specific recipient\nin an envelope\nand are only used\
    \ by the recipient types\nIn Person Signers and Signers.\n\n<!-- START doctoc generated TOC please\
    \ keep comment here to allow auto update -->\n<!-- DON'T EDIT THIS SECTION, INSTEAD RE-RUN doctoc\
    \ TO UPDATE -->\n**On this page**\n\n- [Tab Types](#tab-types)\n- [Sign Here Tab Alignment](#sign-here-tab-alignment)\n\
    - [View Tab](#view-tab)\n- [Requesting Payments](#requesting-payments)\n- [Using Custom Tabs in Envelopes\
    \ and Templates](#using-custom-tabs-in-envelopes-and-templates)\n- [Anchoring Tabs](#anchoring-tabs)\n\
    - [Automatically Populating Tabs](#automatically-populating-tabs)\n\n<!-- END doctoc generated TOC\
    \ please keep comment here to allow auto update -->\n\n\n## Tab Types\n\nSome tabs enable values to\
    \ be entered by the signer. Those tabs' values can be preset either through the web browser or via\
    \ the API. Other tab types use information that is already recognized by the DocuSign platform. These\
    \ tabs cannot have their value updated on a per-tab basis by the API or via the browser. In some cases,\
    \ the info might be settable using a different technique. For example, the Full name tab uses the\
    \ signer's name, which is set elsewhere in the request.\n\nHere is the list of tabs and whether you\
    \ can or cannot set their values in the tab definition:\n\n<br>\n\n| Tab Type                    \
    \                               | Description                                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                 |\n| :---------------------------------------------------------\
    \ | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\
    \ |\n| Approve ([`approve`][approve])                             | Allows the recipient to approve\
    \ documents without placing a signature or initials on the document. If the recipient clicks the tab\
    \ during the signing process, the recipient is considered to have signed the document. No information\
    \ is shown on the document of the approval, but it is recorded as a signature in the envelope history.\
    \ This value **can't** be set.                                                                   \
    \                                                                                                \
    \                                                                                                \
    \                                 |\n| Checkbox ([`checkbox`][checkbox])                         \
    \ | Allows the recipient to select a yes/no (on/off) option. This value can be set.              \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                              |\n| Company ([`company`][company])\
    \                             | Displays the recipient's company name. This value **can't** be set.\
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \         |\n| Date Signed ([`dateSigned`][dateSigned])                   | Displays the date that\
    \ the recipient signed the document. This value **can't** be set.                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                      |\n| Date ([`date`][date])                \
    \                      | Allows the recipient to enter a date. Date tabs are one-line fields that\
    \ allow date information to be entered in any format. The tooltip for this tab recommends entering\
    \ the date as MM/DD/YYYY, but this is not enforced. The format entered by the signer is retained.\
    \ If you need a particular date format enforced, DocuSign recommends using a Text tab with a validation\
    \ pattern and a validation message to enforce the format. This value can be set.                 \
    \                                                                                                \
    \                                                                                       |\n| Decline\
    \ ([`decline`][decline])                             | Allows the recipient the option of declining\
    \ an envelope. If the recipient clicks the tab during the signing process, the envelope is voided.\
    \ This value **can't** be set.                                                                   \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                |\n| Email Address ([`emailAddress`][emailAddress])             |\
    \ Displays the recipient's email as entered in the recipient information. This value **can't** be\
    \ set.                                                                                           \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                             |\n| Email ([`email`][email])\
    \                                   | Allows the recipient to enter an email address. This is a one-line\
    \ field that checks that a valid email address is entered. It uses the same parameters as a Text tab,\
    \ with the validation message and pattern set for email information.<br><br>When getting information\
    \ that includes this tab type, the original value of the tab when the associated envelope was sent\
    \ is included in the response. This value be set.                                                \
    \                                                                                                \
    \                                                                                        |\n| Envelope\
    \ ID ([`envelopeId`][envelopeId])                   | Displays the envelope ID. Recipients cannot\
    \ enter or change the information in this tab.  This value **can't** be set.                     \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                 |\n| First Name ([`firstName`][firstName])                     \
    \ | Displays the recipient's first name. This tab takes the recipient's name as entered in the recipient\
    \ information, splits it into sections based on spaces and uses the first section as the first name.\
    \ This value **can't** be set.                                                                   \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                     |\n| Formula Tab ([`formulaTab`][formulaTab])\
    \                   | The value of a formula tab is calculated from the values of other number or\
    \ date tabs in the document. When the recipient completes the underlying fields, the formula tab calculates\
    \ and displays the result. This value can be set.The `formula` property of the tab contains the references\
    \ to the underlying tabs. See [Calculated Fields][calculatedfields] in the DocuSign Support Center\
    \ to learn more about formulas. If a formula tab contains a `paymentDetails` property, the tab is\
    \ considered a payment item. See [Requesting Payments Along with Signatures][paymentguide] in the\
    \ DocuSign Support Center to learn more about payments. |\n| Full Name ([`fullName`][fullName])  \
    \                       | Displays the recipient's full name. This value **can't** be set.       \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \      |\n| Initial Here ([`initialHere`][initialHere])                | Allows the recipient to initial\
    \ the document. May be optional. This value **can't** be set.                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                              |\n| Last Name ([`lastName`][lastName])           \
    \              | Displays the recipient's last name. This tab takes the recipient's name as entered\
    \ in the recipient information, splits it into sections based on spaces and uses the last section\
    \ as the last name. This value **can't** be set.                                                 \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                           |\n| List\
    \ ([`list`][list])                                      | This tab offers a list of options to choose\
    \ from. The `listItems` property is used to specify the selectable options. This value can be set,\
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                           |\n| Notarize ([`notarize`][notarize])                          | Place\
    \ this tab on a page to alert Notary recipients that they must take action. Only one notarize tab\
    \ can appear on a page. This value can be set.                                                   \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                  |\n| Note ([`note`][note])    \
    \                                  | Displays additional information, in the form of a note, for the\
    \ recipient. This value can be set.                                                              \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \      |\n| Number ([`number`][number])                                | Allows the recipient to enter\
    \ numbers and decimal (.) points. This value can be set.                                         \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                          |\n| Radio Group ([`radioGroup`][radioGroup])         \
    \          | This group tab is used to place radio buttons on a document. The `radios` property is\
    \ used to add and place the radio buttons associated with the group. Only one radio button can be\
    \ selected in a group. This value can be set.                                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                 |\n| Sign Here ([`signHere`][signHere])\
    \                         | Allows the recipient to sign a document. May be optional. This value **can't**\
    \ be set. <br/>**Note**: `signHere` tabs can also be used to add a visual representation for  an electronic\
    \ seal in a document.                                                                            \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \  |\n| Signer Attachment ([`signerAttachment`][signerAttachment]) | Allows the recipient to attach\
    \ supporting documents to an envelope. This value **can't** be set.                              \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                              |\n| SSN ([`ssn`][ssn])                           \
    \              | A one-line field that allows the recipient to enter a Social Security Number. The\
    \ SSN can be typed with or without dashes. It uses the same parameters as a Text tab, with the validation\
    \ message and pattern set for SSN information.  This value can be set.                           \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                            |\n| Text ([`text`][text])\
    \                                      | Allows the recipient to enter any type of text. This value\
    \ can be set.                                                                                    \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \            |\n| Title ([`title`][title])                                   | Displays the recipient's\
    \ title. This value **can't** be set.                                                            \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                    |\n| View ([`view`][view])                  \
    \                    | The View tab is used with the Approve tab to handle supplemental documents.\
    \ This value can be set.                                                                         \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \                                                                                 |\n| Zip ([`zip`][zip])\
    \                                         | Allows the recipient to enter a ZIP code. The ZIP code\
    \ can be five digits or nine digits in the ZIP+4 format. The zip code can be typed with or without\
    \ dashes. It uses the same parameters as a Text tab, with the validation message and pattern set for\
    \ ZIP code information. This value can be set.                                                   \
    \                                                                                                \
    \                                                                                                \
    \                                                                                                \
    \            |\n\n\n[approve]:\t\t      https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/approve\n\
    [checkbox]:\t\t      https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/checkbox\n\
    [company]:\t\t      https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/company\n\
    [dateSigned]:\t\t    https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/dateSigned\n\
    [date]:\t\t          https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/date\n\
    [decline]:\t\t      https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/decline\n\
    [emailAddress]:     https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/emailAddress\n\
    [email]:\t\t        https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/email\n\
    [envelopeId]:\t    \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/envelopeId\n\
    [firstName]:\t    \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/firstName\n\
    [formulaTab]:\t    \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/formulaTab\n\
    [fullName]:\t\t      https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/fullName\n\
    [initialHere]:\t  \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/initialHere\n\
    [lastName]:\t\t      https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/lastName\n\
    [list]:\t           \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/list\n\
    [notarize]:         https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/notarize\n\
    [note]:\t\t          https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/note\n\
    [number]:\t\t        https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/number\n\
    [radioGroup]:\t\t    https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/radioGroup\n\
    [signerAttachment]: https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/signerAttachment\n\
    [signHere]:\t      \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/signHere\n\
    [ssn]:\t          \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/ssn\n\
    [text]:\t          \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/text\n\
    [title]:\t        \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/title\n\
    [view]:\t\t          https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/view\n\
    [zip]:\t          \thttps://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/zip\n\
    \n[calculatedfields]: https://support.docusign.com/en/guides/ndse-user-guide-calculated-fields\n[paymentguide]:\
    \     https://support.docusign.com/en/guides/requesting-payments-along-with-signatures\n\n\n## Sign\
    \ Here Tab Alignment\n\nWhen you provide an x- and y-coordinate for the\nsign here tab,\nthe tab appears\
    \ 21 points *lower*\nthan the value you provide for the y-coordinate.\nTo align the tab as expected,\n\
    subtract 21 from the expected y-value.\n\n![Sign Here Tab Alignment](/img/signherealign.png)\n\n\n\
    \n\n\n## View Tab\n\nThe View tab is used on supplemental documents.\nTo learn more about using the\
    \ View tab with\nsupplemental documents, see\n[Using Supplemental Documents][usingsupdocs]\nin the\
    \ [Sending Documents][sendenvelopes] section of\nthe [Envelope: create][envelopecreate] method.\n\n\
    [sendenvelopes]:  https://developers.docusign.com/esign-rest-api/reference/Envelopes/Envelopes/create/#sending-envelopes\n\
    [usingsupdocs]:   https://developers.docusign.com/esign-rest-api/reference/Envelopes/Envelopes/create/#using-supplemental-documents\n\
    [envelopecreate]: https://developers.docusign.com/esign-rest-api/reference/Envelopes/Envelopes/create/\n\
    \n<br>\n\n| Name              | Required  | Type    | Description |\n| :----             | :---- \
    \    | :----   | :----       |\n| documentId        | Yes       | String  | The document ID number\
    \ that the tab is placed on. This must refer to an existing Document's ID attribute. |\n| pageNumber\
    \        | Yes       | String  | Must be set to 1. |\n| recipientId       | Yes       | String  |\
    \ The recipient associated with the tab. Must refer to an existing recipient's ID attribute. |\n|\
    \ required          | No        | Boolean | If **true**, the recipient is required to select the supplemental\
    \ document View button during signing. |\n| tabLabel          | No        | String  | The label used\
    \ for the tab.  If an empty string is provided for this, an empty sting is used. If no value is provided,\
    \ the tab type is used as the value. Maximum of 500 characters. |\n| templateLocked    | No      \
    \  | Boolean | Optional. Used only when working with template tabs. If **true**, the attributes of\
    \ the tab cannot be changed by the sender. |\n| templateRequired  | No        | Boolean | Optional.\
    \ Used only when working with template tabs. If **true**, the tab cannot be removed by the sender.\
    \ |\n| xPosition         | Yes       | String  | Required, but can be 0.  |\n| yPosition         |\
    \ Yes       | String  | Required, but can be 0. |\n\n\n## Requesting Payments\n\nThe Payments feature\
    \ of the DocuSign eSignature REST API\nlets you collect payments\nalong with signatures and other\
    \ information.\n\nTo send a request for payment\nand collect payments,\nyou need a payment gateway\
    \ account,\nwhich is the destination for the payments.\nCreate a payment account\nwith a supported\
    \ payment gateway,\nand then connect the payment gateway account\nto your DocuSign account.\nTo learn\
    \ how to connect a payment gateway account\nto your DocuSign account\nsee [Managing Payment Gateways][paymentgateways]\n\
    in the DocuSign Support Center.\nYou must connect and manage payment gateway accounts manually\nthrough\
    \ the DocuSign Admin console\nand through your chosen payment gateway.\nThere is no public API\nfor\
    \ connecting payment gateway accounts\nto DocuSign accounts\nor for managing payment gateway accounts.\n\
    \nCurrently\n[Stripe][stripe],\n[Braintree](https://www.braintreepayments.com/), and\n[Authorize.net](https://www.authorize.net/)\n\
    are the supported payment gateways.\n\n### How Payments Work\n\nTo make a request for payment,\nuse\
    \ a [`formulaTab`][formulatab]\nthat has a\n[`paymentDetails`][paymentdetails] object.\nThis object\
    \ includes\na list of [`paymentLineItem`][paymentlineitem] objects.\nEach line item refers to a [`number`][numbertab]\
    \ tab\nthat contains the value of the each item.\nThe purpose of the line items\nis to transmit them\
    \ to the payment gateway\nas metadata, so that you can use the information\nin the payment processor.\n\
    \n**Note**: If the fileExtension parameter is not added in an API call, only base64 converted pdf\
    \ files will be accepted.\nAny attempt to send a non pdf file without using fileExtension results\
    \ in an error.\n\nThis is an example request for two books.\nEach book is specified in the `number`\
    \ tabs\nlabeled \"Hamlet\" and \"Tempest\".\nThe books are referenced as line items\nby their tab\
    \ labels\nwithin the `paymentDetails` object\nof a `formula` tab.\nThe formula of the `formula` tab\n\
    add the values of the same two `number` tabs.\n\n```json\n{\n  \"documents\": [\n    {\n      \"documentBase64\"\
    : \"<base64-encoded PDF document>\",\n      \"documentId\": \"1\",\n      \"fileExtension\": \"pdf\"\
    ,\n      \"name\": \"payment.pdf\"\n    }\n  ],\n  \"emailSubject\": \"Order Some Books\",\n  \"recipients\"\
    : {\n    \"signers\": [\n      {\n        \"email\": \"vreader@example.com\",\n        \"name\": \"\
    Voracious Reader\",\n        \"recipientId\": \"1\",\n        \"routingOrder\": \"1\",\n        \"\
    tabs\": {\n          . . .\n          \"numberTabs\": [\n            {\n              \"value\": \"\
    10.00\",\n              \"width\": 78,\n              \"required\": \"true\",\n              \"locked\"\
    : \"true\",\n              \"tabLabel\": \"Hamlet\",\n              \"documentId\": \"1\",\n     \
    \         \"pageNumber\": \"1\",\n              \"xPosition\": \"323\",\n              \"yPosition\"\
    : \"134\"\n            },\n            {\n              \"value\": \"10.00\",\n              \"width\"\
    : 78,\n              \"required\": \"true\",\n              \"locked\": \"true\",\n              \"\
    tabLabel\": \"Tempest\",\n              \"documentId\": \"1\",\n              \"pageNumber\": \"1\"\
    ,\n              \"xPosition\": \"323\",\n              \"yPosition\": \"154\"\n            }\n  \
    \        ],\n          \"formulaTabs\": [\n            {\n              \"required\": \"true\",\n\
    \              \"formula\": \"([Hamlet] + [Tempest]) * 100\",\n              \"roundDecimalPlaces\"\
    : \"2\",\n              \"paymentDetails\": {\n                \"currencyCode\": \"USD\",\n      \
    \          \"lineItems\": [\n                  {\n                    \"name\": \"Hamlet\",\n    \
    \                \"description\": \"The Danish Play\",\n                    \"itemCode\": \"SHAK1\"\
    ,\n                    \"amountReference\": \"Hamlet\"\n                  },\n                  {\n\
    \                    \"name\": \"Othello\",\n                    \"description\": \"The one with Caliban\
    \ in it\",\n                    \"itemCode\": \"SHAK2\",\n                    \"amountReference\"\
    : \"Tempest\"\n                  }\n                ],\n                \"gatewayAccountId\": \"e76668b4-53a9-4413-b551-a208d659e490\"\
    \n              },\n              \"tabLabel\": \"Payment1\",\n              \"documentId\": \"1\"\
    ,\n              \"pageNumber\": \"1\",\n              \"xPosition\": 300,\n              \"yPosition\"\
    : 200\n            }\n          ]\n        }\n      }\n    ]\n  },\n  \"status\": \"sent\"\n}\n```\n\
    \nUse the\n[EnvelopeRecipients: list][enveloperecipientslist] method\nto check the status of a payment.\n\
    When the payment is successful,\nthe `status` property of\nthe [`paymentDetails`][paymentdetails]\
    \ object\nis `payment_complete`.\n\n```json\n{\n  \"signers\": [\n    {\n      \"tabs\": {\n     \
    \   . . .\n        \"numberTabs\": [\n          {\n            \"value\": \"10.00\",\n           \
    \ \"tabLabel\": \"Hamlet\",\n            \"documentId\": \"1\",\n            \"recipientId\": \"1\"\
    ,\n            \"pageNumber\": \"1\",\n            \"xPosition\": \"323\",\n            \"yPosition\"\
    : \"134\",\n          },\n          {\n            \"value\": \"10.00\",\n            \"tabLabel\"\
    : \"Tempest\",\n            \"documentId\": \"1\",\n            \"recipientId\": \"1\",\n        \
    \    \"pageNumber\": \"1\",\n          }\n        ],\n        \"formulaTabs\": [\n          {\n  \
    \          \"formula\": \"([Hamlet] + [Tempest]) * 100\",\n            \"roundDecimalPlaces\": \"\
    2\",\n            \"paymentDetails\": {\n              \"status\": \"payment_complete\",\n       \
    \       \"currencyCode\": \"USD\",\n              \"lineItems\": [\n                {\n          \
    \        \"name\": \"Hamlet\",\n                  \"description\": \"The Danish Play\",\n        \
    \          \"itemCode\": \"SHAK1\",\n                  \"amountReference\": \"Hamlet\"\n         \
    \       },\n                {\n                  \"name\": \"Tempest\",\n                  \"description\"\
    : \"The one with Caliban in it\",\n                  \"itemCode\": \"SHAK2\",\n                  \"\
    amountReference\": \"Tempest\"\n                }\n              ],\n              \"gatewayAccountId\"\
    : \"e76668b4-53a9-4413-b551-a208d659e490\"\n            },\n            \"value\": \"20\",\n     \
    \       \"required\": \"true\",\n            \"locked\": \"false\",\n            \"tabLabel\": \"\
    Payment1\",\n            \"documentId\": \"1\",\n            \"recipientId\": \"1\",\n           \
    \ \"pageNumber\": \"1\",\n          }\n        ]\n      },\n      \"creationReason\": \"sender\",\n\
    \      \"email\": \"vreader@example.com\",\n      \"name\": \"Voracious Reader\",\n      \"recipientId\"\
    : \"1\",\n      \"requireIdLookup\": \"false\",\n      \"status\": \"completed\",\n    }\n  ],\n \
    \ . . .\n}\n```\n\n### Some Things to Keep in Mind About Payments\n\n* An envelope is not completed\
    \ until all payments are completed.\n\n* If a DocuSign account Administrator\n  deletes a payment\
    \ gateway account connection\n  DocuSign cancels all in-process envelopes\n  that reference the deleted\
    \ payment gateway account.\n\n* If the sender voids an envelope,\n  all payment authorizations are\
    \ canceled.\n\n* If a required recipient refuses to sign,\n  all authorized payments are canceled.\n\
    \n* If a required recipient's payment fails authorization,\n  DocuSign attempts to recover\n  by sending\
    \ the recipient\n  notification about the failed payment authorization.\n  The recipient has the opportunity\n\
    \  to correct the payment method information.\n\n* Each recipient's payment is authorized separately.\n\
    \  Accounts are charged and payment made\n  after all required tabs are completed,\n  and all payments\
    \ in an envelope for all recipients are authorized.\n\n* Refunds are not supported.\n  Conduct refunds\
    \ or payment changes\n  with the payment gateway separately from DocuSign.\n\n* At this time, DocuSign\
    \ does not charge a per-transaction fee.\n\n\n[enveloperecipientslist]: https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipients/list/\n\
    [formulatab]:             https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/formulaTab\n\
    [ISO4217]:                https://en.wikipedia.org/wiki/ISO_4217\n[numbertab]:              https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/number\n\
    [paymentgateways]:        https://support.docusign.com/en/guides/managing-payment-gateways\n[paymentguide]:\
    \           https://support.docusign.com/en/guides/requesting-payments-along-with-signatures\n[paymentlineitem]:\
    \        https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/paymentLineItem\n\
    [paymentdetails]:         https://developers.docusign.com/esign-rest-api/reference/Envelopes/EnvelopeRecipientTabs/create/#/definitions/paymentDetails\n\
    [stripe]:                 https://stripe.com/\n\n\n## Using Custom Tabs in Envelopes and Templates\n\
    \nCustom Tabs can be added to envelopes and templates\nby setting the `customTabId` property\nwhen\
    \ creating an envelope or template recipient\nor when adding a new tab for an existing recipient.\n\
    The custom tab must be added as the correct tab type.\nFor example if the custom tab type is text,\
    \ it cannot be used as a number tab.\n\nWhen the `customTabId` property is set,\nthe new tab inherits\
    \ all the custom tab properties.\nRequired information that is not included in the custom tab,\nsuch\
    \ as document ID and page ID, must be included when adding the tab.\nIf the custom tab does not have\
    \ anchor settings, the X and Y positions must be included.\n\nAfter the tab is created,\nit is treated\
    \ as any other tab for updating or deleting.\n\n## Anchoring Tabs\n\nThe tab anchoring option\nallows\
    \ you to send documents for signature\nthat do not have a fixed layout or format.\nIn these documents\
    \ you might not know\nthe absolute location of the tabs\nwhen you design your API client application\
    \ because the tabs must move with text.\nAs an alternative to sending X and Y coordinates for tabs,\n\
    the DocuSign Service can derive an anchor location for the tab\nby correlating anchor information\
    \ to data within the document.\n\nWhen the DocuSign Service receives a request that contains tabs\n\
    with anchor information,\nit searches the document for instances of the `anchorString` property.\n\
    When found,\nit places a tab of the specified type for the designated recipient.\nTab positions are\
    \ established by setting offsets for the tab.\n\nWhen you apply tabs to the document,\nDocuSign does\
    \ not remove or replace the text in the `anchorString` property. You can hide codified anchors by\
    \ using the same font color as the background of the document. So the anchor can be used by DocuSign\
    \ processes and it will not be visible on the document.\n\nTo use an anchoring option:\n\n1. Identify\
    \ the location in the document by text string. You can use a pre-existing text string or add a new\
    \ one.\nFor best performance DocuSign recommends using single word anchor strings when possible, especially\
    \ when there are a large number of pages in the envelope.\nFor example, you might want to add a Sign\
    \ Here tab to the \"Borrower's Signature\" lines in a document, but that phrase might occur in places\
    \ in the document where you don't want to tab to appear. In this case, you could add the text \"BorrowerSignHere\"\
    \ in white font color (so that isn't visible in the document) to all the places you want Sign Here\
    \ tabs to appear and use \"BorrowerSignHere\" as the anchor string.\n1. Reference the anchor through\
    \ the `anchorString` property of the tab.\n1. Determine the offset from the anchor string location\
    \ to where the tab should be placed.\n\nSetting a positive value in the `anchorXOffset` property moves\
    \ the tab right on the page and positive values in the  `anchorYoffset` prove moves the tab down the\
    \ page. The `anchorUnits` property specifies the units used for the offsets.\nFor Sign Here and Initial\
    \ Here tabs the bottom-left of the anchor string is equivalent to position (0,0), and the bottom-left\
    \ of the tab graphic is placed relative to that.\nFor all other tabs the bottom-left of the anchor\
    \ string is equivalent to position (0,0), and the top-left of the tab graphic is placed relative to\
    \ that.\nDocuSign does not currently provide tools to derive the offset values. Determination of the\
    \ proper offset will likely require some trial-and-error.\n\n### Rules for working with anchor tags\n\
    \nWhen anchor tabs are used, all documents in the envelope are searched for the `anchorString` property.\n\
    \n* You set the text of the anchor string in the `anchorString` property. DocuSign tabs are created\
    \ for each instance of the `anchorString` property within the document, so special care must be taken\
    \ to establish unique anchor strings that do not result in unintentional tabs.\n* You cannot use the\
    \ same anchored tab for different recipients for the same document.\n* The DocuSign system cannot\
    \ search for text that is embedded in an image when checking for anchor strings.\n* X or Y offsets\
    \ supplied for a tab apply to all instances of the tab in the document. To use different offsets at\
    \ different locations in the document for the same recipient, create multiple, unique anchor tabs.\n\
    * If the Y offset value of an anchor string would force a tab outside of the page boundaries, the\
    \ tag is placed at the page boundary. If the X offset value places a tab outside of the page boundaries,\
    \ the error message `Invalid_User_Offset` is sent. The error message includes the X offset that resulted\
    \ in the error.\n* The system does not support an anchor string embedded in the form of a PDF X-object\
    \ in the document.\n* The system does not re-flow the text that surrounds the anchor tabs. It is the\
    \ responsibility of the document author to provide sufficient white space to contain the potential\
    \ width of the ultimate tab value.\n\n### Tips and Tricks\n\nThe following are tips for effective\
    \ use of anchor tags:\n* In order to avoid unintentional conflicts between text contained in an `anchorString`\
    \ property and the text that naturally exists in documents, establish a codified syntax for the anchor\
    \ string text that is unlikely to appear elsewhere in a document.\n* Develop an extensible and consistent\
    \ syntax that can be used across multiple document types.\n* Especially for documents that have variable\
    \ numbers of tabs or signers, author the source document to include hidden anchor tabs for all potential\
    \ signers/permutations. Then, control the tabs that are actually placed by including/excluding the\
    \ anchor tabs in the request. This approach allows a single document to be used for all use cases\
    \ instead of maintaining separate documents for each scenario.\n\n## Automatically Populating Tabs\n\
    \nIf you want similar tab types\nto automatically populate with the same data,\nyou must follow these\
    \ guidelines:\n\n* Each `tabLabel` entry must have the characters\n  `\\\\*` in front of the label.\n\
    \  If you omit the `\\\\*` prefix,\n  only the first occurrence of the tab is populated.\n\n  When\
    \ automatically populating tabs,\n  the `tabLabel` must not contain any spaces.\n  In the JSON example\
    \ below,\n  the Text tabs  properties `StudentLastName` and `StudentFirstName`\n  will be auto-populated\
    \ as specified (\"Doe\" and \"John\")\n  each place they appear throughout the envelope.\n\n  ```\n\
    \  \"tabs\": {\n    \"textTabs\": [\n    {\n      \"tabLabel\": \"\\\\*StudentLastName\",\n      \"\
    value\": \"Doe\"\n    },\n    {\n      \"tabLabel\": \"\\\\*StudentFirstName\",\n      \"value\":\
    \ \"John\"\n    }]\n  }\n  ```\n\n* Each occurrence of the tab must have identical properties.\n\n\
    \  For example, suppose there are two Text tabs in a document,\n  each with `tabLabel` set to `Name`.\n\
    \  If one tab has the `bold` property set to **true**,\n  and the other has the `bold` property set\
    \ to **false**,\n  only the first one will be populated.\n  In order to automatically populate both\
    \ occurrences\n  of the `Name` Text tabs,\n  the `bold` property must be set to the same value for\
    \ both tabs."
