- aid: docusign:docusign-accountbrands-api
  name: Docusign AccountBrands API
  description: >-
    The AcccountBrands resource provides methods that allow you to create and delete the account brand
    associated with an account.


    Branding allows you to add the look and feel of your organization's

    brand to the sending, signing, and email process making it easier for users to identify envelopes
    coming from your organization.


    The DocuSign Account Custom Branding feature lets you set the colors, logo, and text for your account.
    You can create any number of brand profiles with different settings to reflect each of your corporate
    brands or different internal divisions or departments.


    When you create or change a branding profile, it applies to everyone using that profile and affects
    all envelopes sent with that profile.
  humanURL: https://developers.docusign.com/docs/esign-rest-api/
  baseURL: https://demo.docusign.net/restapi
  tags:
  - AccountBrands
