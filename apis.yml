- aid: docusign:docusign-accountcustomfields-api
  name: Docusign AccountCustomFields API
  description: "The CustomFields resource provides a method that enables you to retrieve the custom fields\
    \ associated with an account.\n\nThese fields can be used with your account's envelopes to record\
    \ information about the envelopes. The fields can be searched to find matching envelopes and track\
    \ information. \n\nThe envelope custom fields are shown in the DocuSign member console's Envelope\
    \ Settings section when a user creates an envelope. The envelope custom fields are not seen by envelope\
    \ recipients.\n\nThere are two types of envelope custom fields, text and list. A text custom field\
    \ lets the sender enter the value for the field. The list custom field lets the sender select the\
    \ value of the field from a pre-determined list."
  humanURL: https://developers.docusign.com/docs/esign-rest-api/
