  version: v2.1
servers:
- url: https://api.docusign.net/Management
tags:
- name: AccountSignatureProviders
  description: This resource provides information on the Standards Based Signature providers that have been provisioned for this account.
paths:
  /v2/accounts/{accountId}/signatureProviders:
    get:
      tags:
      - AccountSignatureProviders
      summary: Docusign Returns Account available signature providers for specified account.
      operationId: AccountSignatureProviders_GetSignatureProviders
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account id GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/accountSignatureProviders'
        '400':
          description: Error encountered.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: listSignatureProviders
      x-ds-method: list
      x-ds-service: Accounts
      x-ds-in-sdk: true
