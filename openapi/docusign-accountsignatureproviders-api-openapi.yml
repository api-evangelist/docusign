          type: string
          description: ''
        signatureProviderOptionName:
          type: string
          description: ''
      description: ''
      x-ds-definition-name: accountSignatureProviderOption
      x-ms-summary: ''
  securitySchemes:
    accessCode:
      type: oauth2
      description: OAuth2 Access code Grant
      flows:
        authorizationCode:
          authorizationUrl: https://account.docusign.com/oauth/auth
