      summary: Docusign Obtains the specified image for a brand.
      operationId: BrandLogo_GetBrandLogo
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account id GUID.
        required: true
        schema:
          type: string
      - name: brandId
        in: path
        description: The unique identifier of a brand.
        required: true
        schema:
          type: string
      - name: logoType
        in: path
        description: One of **Primary**, **Secondary** or **Email**.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          description: Error encountered.
          content:
            image/png:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
