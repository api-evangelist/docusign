openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Account Brands API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: AccountBrands
  description: 'The AcccountBrands resource provides methods that enable you to create and manage brands for an account.


    Branding enables you to add the look and feel of your organization''s brand to the sending, signing, and email processes, making it easier for recipients to identify envelopes coming from your organization.


    The Docusign Account Custom Branding feature enables you to set the colors, logo, and text that recipients see at the account level. The settings associated with a brand are applied to all of the envelopes that use the brand. You can create multiple brand profiles for different corporate brands or internal departments.


    **Note:** To use this resource, branding for either signing or sending must be enabled for the account (either `canSelfBrandSend`, `canSelfBrandSign`, or both of these account settings must be set to **true**).


    ### Next steps

    * See how to create a brand via the API.

    * Learn how to apply a brand to an envelope.'
paths:
  /v2.1/accounts/{accountId}/brands:
    parameters: []
    get:
      tags:
      - AccountBrands
      summary: Gets a list of brands
      description: 'This method returns details about all of the brands associated with an account,

        including the default brand profiles.


        Either or both of the following settings must be enabled for the account to use this method:


        - `canSelfBrandSign`

        - `canSelfBrandSend`


        ### Related topics


        - How to create a brand

        - How to apply a brand to an envelope'
      operationId: Brands_GetBrands
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: exclude_distributor_brand
        in: query
        description: When **true,** excludes distributor brand information from the response set.
        required: false
        schema:
          type: string
      - name: include_logos
        in: query
        description: When **true,** returns the logos associated with the brand.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBrands'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: listBrands
      x-ds-method: list
      x-ds-service: Accounts
      x-ds-in-sdk: true
    post:
      tags:
      - AccountBrands
      summary: Creates one or more brand profiles for an account
      description: 'This method creates one or more brand profile files for an account.


        To specify logos for the brand,

        use the

        AccountBrands: updateLogo

        method

        after you create the brand.


        Either or both of the following settings must be enabled for the account to use this method:


        - `canSelfBrandSign`

        - `canSelfBrandSend`


        ### Related topics


        - How to create a brand'
      operationId: Brands_PostBrands
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBrands'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createBrand
      x-ds-method: create
      x-ds-service: Accounts
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/brand'
          application/xml:
            schema:
              $ref: '#/components/schemas/brand'
    delete:
      tags:
      - AccountBrands
      summary: Deletes one or more brand profiles
      description: 'This method deletes one or more brand profiles from an account, based on the brand IDs that you include in the `brandsRequest`.


        Either or both of the following settings must be enabled for the account to use this method:


        - `canSelfBrandSign`

        - `canSelfBrandSend`


        ### Related topics


        - How to create a brand'
      operationId: Brands_DeleteBrands
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountBrands'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteBrands
      x-ds-method: deleteList
      x-ds-service: Accounts
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/brandsRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/brandsRequest'
  /v2.1/accounts/{accountId}/brands/{brandId}:
    parameters: []
    get:
      tags:
      - AccountBrands
      summary: Gets information about a brand
      operationId: Brand_GetBrand
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: brandId
        in: path
        description: The ID of the brand.
        required: true
        schema:
          type: string
      - name: include_external_references
        in: query
        required: false
        description: When **true,** the landing pages and links associated with the brand are included in the response.
        schema:
          type: string
      - name: include_logos
        in: query
        required: false
        description: When **true,** the URIs for the logos associated with the brand are included in the response.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brand'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getBrand
      description: 'This method returns details about an account brand.


        **Note:** Branding for either signing or sending must be enabled for the account (`canSelfBrandSend` , `canSelfBrandSign`, or both of these account settings must be **true**).'
      x-ds-method: get
      x-ds-service: Accounts
      x-ds-in-sdk: true
    put:
      tags:
      - AccountBrands
      summary: Updates an existing brand
      operationId: Brand_PutBrand
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: brandId
        in: path
        description: The ID of the brand.
        required: true
        schema:
          type: string
      - name: replace_brand
        in: query
        required: false
        description: When **true,** replaces the brand instead of updating it. The only unchanged value is the brand ID. The request body must be XML. The default value is **false.**
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/brand'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateBrand
      description: 'This method updates an account brand.


        **Note:** Branding for either signing or sending must be enabled for the account (`canSelfBrandSend` , `canSelfBrandSign`, or both of these account settings must be **true**).'
      x-ds-method: update
      x-ds-service: Accounts
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/brand'
          application/xml:
            schema:
              $ref: '#/components/schemas/brand'
    delete:
      tags:
      - AccountBrands
      summary: Deletes a brand
      operationId: Brand_DeleteBrand
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: brandId
        in: path
        description: The ID of the brand.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteBrand
      description: 'This method deletes a brand from an account.


        **Note:** Branding for either signing or sending must be enabled for the account (`canSelfBrandSend` , `canSelfBrandSign`, or both of these account settings must be **true**).'
      x-ds-method: delete
      x-ds-service: Accounts
      x-ds-in-sdk: true
  /v2.1/accounts/{accountId}/brands/{brandId}/file:
