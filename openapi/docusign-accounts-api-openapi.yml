      x-ds-method: listUnsupportedFileTypes
      x-ds-service: Accounts
      x-ds-in-sdk: true
  /v2.1/accounts/provisioning:
    parameters: []
    get:
      tags:
      - Accounts
      summary: Retrieves the account provisioning information for the account
      description: Retrieves the account provisioning information for the account.
      operationId: Accounts_GetProvisioning
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/provisioningInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getProvisioning
      x-ds-method: getProvisioning
      x-ds-service: Accounts
      x-ds-in-sdk: true
components:
  schemas:
    templateSharedItem:
      type: object
      properties:
        errorDetails:
          $ref: '#/components/schemas/errorDetails'
          description: This object describes errors that occur. It is only valid for responses and ignored in requests.
        owner:
          $ref: '#/components/schemas/userInfo'
          description: Information about the user who owns the template.
        password:
          description: 'The user''s password.


            This property is used only when adding a new user via a [Users: create](/docs/esign-rest-api/reference/users/users/create/) request. The value must conform to the password rules defined in the account [Security Settings](https://apps-d.docusign.com/admin/authenticate?goTo=securityInfo).


            This property is not returned by `GET` requests and cannot be updated via `PUT` requests.'
