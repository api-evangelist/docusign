      tags:
      - Accounts
      summary: Gets the envelope purge configuration for an account
      operationId: EnvelopePurgeConfiguration_GetEnvelopePurgeConfiguration
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/envelopePurgeConfiguration'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getEnvelopePurgeConfiguration
      x-ds-api-status: beta
      description: 'An envelope purge configuration enables account administrators to permanently remove documents and their field data from completed and voided envelopes after a specified retention period (`retentionDays`). This method retrieves the current envelope purge configuration for your account.


        **Note:** To use this method, you must be an account administrator.'
      x-ds-method: getEnvelopePurgeConfiguration
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
    put:
      tags:
      - Accounts
      summary: Sets the envelope purge configuration for an account
      operationId: EnvelopePurgeConfiguration_PutEnvelopePurgeConfiguration
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/envelopePurgeConfiguration'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateEnvelopePurgeConfiguration
      x-ds-api-status: beta
      description: 'An envelope purge configuration enables account administrators to permanently remove documents and their field data from completed and voided envelopes after a specified retention period (`retentionDays`). This method sets the envelope purge configuration for your account.


        **Note:** To use this method, you must be an account administrator.


        For more information, see Purge Envelopes.'
      x-ds-method: updateEnvelopePurgeConfiguration
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/envelopePurgeConfiguration'
          application/xml:
            schema:
              $ref: '#/components/schemas/envelopePurgeConfiguration'
