openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Connect Configurations API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: ConnectConfigurations
  description: 'The `ConnectConfigurations` resource enables you to configure the

    Docusign Connect service for your account.


    You can use this resource to configure account-level webhooks

    that send notifications about every envelope sent from your

    account. You can set account-level webhooks to listen for events

    for envelopes sent by a specific user on your account, by

    multiple specific users, or from any of the users on your

    account. These events will be tracked, and can be delivered to a

    listening application.


    **Note:** To create an envelope-level webhook instead of using

    account-level webhooks, use the Envelopes::Create method and add

    an `eventNotification` object to an envelope object.


    Docusign Connect offers two delivery modes:


    - Send Individual Messages

    - Send Aggregated Messages


    By default, the Send Individual Messages mode

    is enabled.

    You can disable it

    (enabling Aggregated Messages mode)

    through Docusign Admin

    in the **Updates** section.


    **Note:** In either mode, Connect

    must be enabled

    in your Docusign account. It is not enabled by default.


    ## Send Individual Messages


    Send Individual Messages (SIM) mode is the default.


    In this mode Docusign delivers notifications for each

    envelope events individually.

    When a final recipient completes an envelope,

    your listener will receive

    a single **Recipient Signed/Completed** event

    followed by a single **Envelope Signed/Completed** event

    for the final participating party on the agreement.


    For more information about SIM mode, see

    Using Connect''s Send Individual Messages Feature.


    ## Aggregated Messages


    In Aggregated Messages mode,

    Connect aggregates similar events

    into a single delivery.

    Similar or simultaneous events

    are aggregated,

    so that your listener doesn''t

    receive extraneous messages.


    When the final recipient signs an envelope, the

    system delivers a single, aggregated Connect event, rather than

    separate Recipient: complete and Envelope: complete messages.

    This aggregation process ensures that you only receive the

    minimal viable number of messages about an envelope''s life cycle.'
paths:
  /v2.1/accounts/{accountId}/connect:
    parameters: []
    get:
      tags:
      - ConnectConfigurations
      summary: Get Connect configuration information
      description: 'Retrieves all the Docusign Custom Connect definitions for the specified account.


        To use this method, you must be an account administrator

        and Connect must be enabled on your account.'
      operationId: Connect_GetConnectConfigs
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectConfigResults'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: listConfigurations
      x-ds-method: list
      x-ds-service: Connect
      x-ds-in-sdk: true
    put:
      tags:
      - ConnectConfigurations
      summary: Updates a specified Connect configuration
      description: 'Updates the specified Docusign Connect configuration in your account. To enable the configuration, set the `allowEnvelopePublish` property to **true.**


        After any updates, test your configuration to make sure it works as expected.


        To use this method, you must be an account administrator

        and Connect must be enabled on your account.'
      operationId: Connect_PutConnectConfiguration
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectCustomConfiguration'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateConfiguration
      x-ds-method: update
      x-ds-service: Connect
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectCustomConfiguration'
          application/xml:
            schema:
              $ref: '#/components/schemas/connectCustomConfiguration'
    post:
      tags:
      - ConnectConfigurations
      summary: Creates a Connect configuration
      description: 'Creates a custom Connect configuration for the specified account.


        To use this method, you must be an account administrator

        and Connect must be enabled on your account.


        Connect is a webhook service that provides updates when certain events occur in your eSignature workflows. You can use this endpoint to create:

        * Account-level Connect configurations to listen for events related to any envelopes sent by one or more account users

        * Recipient Connect configurations that are triggered when one or more of your account users receive an envelope


        To set an account-level configuration, set `configurationType` to **custom.**

        To set a Recipient Connect configuration, set `configurationType` to **customrecipient.**


        If you want to listen for events on only one envelope, use the eventNotification object instead.


        ## Data models


        There are four possible data models for your Connect configuration. Consider:

        * Do you want the data in JSON or XML?

        * Do you want events sent individually (SIM) or in aggregate?


        Docusign recommends using the JSON SIM event model.


        JSON SIM (Recommended)


        Set `deliveryMode` to **SIM** and `eventData.version` to **restv2.1.** Use the `events` property to set the event statuses that will trigger your configuration.


        The following sample request shows how to create an envelope-level configuration using JSON SIM:

        ```

        {

        "configurationType": "custom",

        "urlToPublishTo": "YOUR-WEBHOOK-URL",

        "allUsers": "true",

        "name": "jsonSimTest",

        "deliveryMode": "SIM",

        "allowEnvelopePublish": "true",

        "enableLog": "true",

        "eventData": {

        "version": "restv2.1"

        },

        "events": [

        "envelope-sent",

        "envelope-delivered",

        "envelope-completed"

        ]

        }

        ```


        The following sample request shows how to create a Recipient Connect configuration using JSON SIM:

        ```

        {

        "configurationType": "customrecipient",

        "urlToPublishTo": "YOUR-WEBHOOK-URL",

        "allUsers": "true",

        "name": "jsonSimTest",

        "deliveryMode": "SIM",

        "allowEnvelopePublish": "true",

        "enableLog": "true",

        "eventData": {

        "version": "restv2.1"

        },

        "events": [

        "recipient-sent",

        "recipient-completed"

        ]

        }

        ```


        JSON Aggregate


        Set `deliveryMode` to **aggregate** and `eventData.version` to **restv2.1.** Use the `envelopeEvents` or `recipientEvents` property to set the event statuses that will trigger your configuration.


        XML Aggregate


        Set `deliveryMode` to **aggregate.** Use the `envelopeEvents` or `recipientEvents` property to set the event statuses that will trigger your configuration.


        XML SIM (Legacy apps only)


        **Note:** This model is deprecated.


        Set `deliveryMode` to **SIM.** Use the `envelopeEvents` or `recipientEvents` property to set the event statuses that will trigger your configuration.


        ## Troubleshooting


        If your configuration is not working, check the following.


        * Connect must be enabled for your account to use this function.

        * If you are using `envelopeEvents` or `recipientEvents`, make sure that the event values are sentence case, not lowercase.

        * Make sure you have either set `allUsers` to **true** or set `userIds` to a non-empty array of IDs.

        * By default, this endpoint creates a disabled configuration. To enable the configuration immediately, set the body parameter `allowEnvelopePublish` to **true.** You can also enable the configuration in the UI.

        * To check if events are being emitted, set `enableLog` to **true** to view event logs in the Connect console.


        ## Related topics


        * For more information about Connect, see the Docusign Connect guide.

        * Use the MyAPICalls sample app to see an example of this endpoint using the JSON SIM model.'
      operationId: Connect_PostConnectConfiguration
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/connectCustomConfiguration'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createConfiguration
      x-ds-method: create
      x-ds-service: Connect
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectCustomConfiguration'
          application/xml:
            schema:
              $ref: '#/components/schemas/connectCustomConfiguration'
