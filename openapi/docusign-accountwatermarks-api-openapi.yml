openapi: 3.0.1
info:
  title: DocuSign Admin AccountBrands AccountWatermarks API
  description: An API for an organization administrator to manage organizations, accounts and users
  termsOfService: https://www.docusign.com/company/terms-and-conditions/developers
  contact:
    name: DocuSign Developer Center
    url: https://developers.docusign.com
    email: devcenter@docusign.com
  version: v2.1
servers:
- url: https://api.docusign.net/Management
tags:
- name: AccountWatermarks
  description: The AccountWatermarks resource provides methods that allow you to obtain, preview and update watermark information.
paths:
  /v2/accounts/{accountId}/watermark:
    get:
      tags:
      - AccountWatermarks
      summary: Docusign Get watermark information.
      operationId: Watermark_GetWatermark
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account id GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/watermark'
        '400':
          description: Error encountered.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getWatermark
      x-ds-method: get
      x-ds-service: Accounts
      x-ds-in-sdk: true
    put:
      tags:
      - AccountWatermarks
      summary: Docusign Update watermark information.
      operationId: Watermark_PutWatermark
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account id GUID.
        required: true
        schema:
          type: string
      requestBody:
        description: 'When set to **true**, the account has the watermark feature enabled, and the envelope is not complete, the watermark for the account is added to the PDF documents. This option can remove the watermark. '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/watermark'
          application/xml:
            schema:
              $ref: '#/components/schemas/watermark'
        required: false
      responses:
        '200':
          description: Successful response.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/watermark'
        '400':
          description: Error encountered.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateWatermark
      x-ds-method: update
      x-ds-service: Accounts
      x-ds-in-sdk: true
      x-codegen-request-body-name: watermark
  /v2/accounts/{accountId}/watermark/preview:
    put:
      tags:
      - AccountWatermarks
      summary: Docusign Get watermark preview.
      operationId: WatermarkPreview_PutWatermarkPreview
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account id GUID.
        required: true
        schema:
          type: string
      requestBody:
        description: 'When set to **true**, the account has the watermark feature enabled, and the envelope is not complete, the watermark for the account is added to the PDF documents. This option can remove the watermark. '
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/watermark'
          application/xml:
            schema:
              $ref: '#/components/schemas/watermark'
        required: false
      responses:
        '200':
          description: Successful response.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/watermark'
        '400':
          description: Error encountered.
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getWatermarkPreview
      x-ds-method: preview
      x-ds-service: Accounts
      x-ds-in-sdk: true
      x-codegen-request-body-name: watermark
