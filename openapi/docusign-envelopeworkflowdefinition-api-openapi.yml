      x-ds-service: Uncategorized
      description: 'Delete the delayed routing object for an envelope''s workflow step. You cannot call this endpoint once the delay is in progress. As a workaround, you can update the delay or send time to one minute in the future using the updateEnvelopeDelayedRoutingDefinition endpoint.


