openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Envelope Workflow Definition API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: EnvelopeWorkflowDefinition
  description: 'Describes the workflow for an envelope or template. These methods enable you to use the scheduled sending and delayed routing features.


    ### Related topics


    - How to schedule an envelope

    - How to send an envelope with delayed routing'
paths:
  /v2.1/accounts/{accountId}/envelopes/{envelopeId}/workflow:
    parameters: []
    get:
      tags:
      - EnvelopeWorkflowDefinition
      summary: Returns the workflow definition for an envelope
      operationId: EnvelopeWorkflowDefinitionV2_GetEnvelopeWorkflowDefinition
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflow'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getEnvelopeWorkflowDefinition
      description: Returns the workflow definition for the envelope specified by `envelopeId`. If the envelope does not have a workflow object, this method returns a 404.
      x-ds-method: getEnvelopeWorkflowDefinition
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
    put:
      tags:
      - EnvelopeWorkflowDefinition
      summary: Updates the workflow definition for an envelope
      operationId: EnvelopeWorkflowDefinitionV2_PutEnvelopeWorkflowDefinition
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workflow'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateEnvelopeWorkflowDefinition
      description: 'Updates the specified envelope''s workflow.


        You can use this endpoint to add scheduled sending to a draft envelope. You can also update the scheduled sending for a sent envelope if the scheduled sending countdown is in progress. In that case, the envelope will be reset to a draft state.


        You can also add delayed routing to a draft envelope or a sent envelope that has not started workflow processing.'
      x-ds-method: updateEnvelopeWorkflowDefinition
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/workflow'
          application/xml:
            schema:
              $ref: '#/components/schemas/workflow'
    delete:
      tags:
      - EnvelopeWorkflowDefinition
      summary: Delete the workflow definition for an envelope
      operationId: EnvelopeWorkflowDefinitionV2_DeleteEnvelopeWorkflowDefinition
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteEnvelopeWorkflowDefinition
      description: 'Deletes the specified envelope''s workflow definition if it has one.


        **Note:** If the envelope was scheduled to be sent, this endpoint will cancel the scheduled send and the envelope status will be reset to

        `created`. To resend the envelope, call the update the status to `sent` with the Envelopes::Update method.'
      x-ds-method: deleteEnvelopeWorkflowDefinition
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
