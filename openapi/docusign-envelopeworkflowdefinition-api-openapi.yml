components:
  schemas:
    scheduledSending:
      type: object
      properties:
        bulkListId:
          description: The ID of the bulk list. Set this optional value to use scheduled sending with a bulk send operation.
          type: string
        resumeDate:
          description: 'The timestamp of when the envelope is scheduled to be sent in ISO 8601 format.


            This property is read-only.

            '
          type: string
        rules:
          description: User-specified rules indicating how and when the envelope should be scheduled for sending. Only one rule may be specified.
          type: array
          items:
            $ref: '#/components/schemas/envelopeDelayRule'
        status:
          description: 'Status of the scheduled sending job. Valid values:


            * `pending`: The envelope has not yet been sent and the scheduled sending delay has not been initiated.

            * `started`: The sender has initiated the sending process. The delay has not elapsed, so the envelope has not yet been sent to the first recipient.

            * `completed`: The delay has elapsed and the envelope has been sent to the first recipient.


            This property is read-only.'
          type: string
      x-ds-definition-name: scheduledSending
      description: A complex element that specifies the scheduled sending settings for the envelope.
      x-ms-summary: A complex element that specifies the scheduled sending settings for the envelope.
    envelopeDelayRule:
      type: object
      properties:
        delay:
          description: A string timespan representing the duration of the sending delay. The timespan is in the format `d.hh:mm:ss` where `d` is the number of days, `hh` is the number of hours (measured on a 24-hour clock), `mm` is minutes, and `ss` is seconds. The maximum delay is 30 days.
          type: string
        resumeDate:
          description: An ISO 8601 formatted datetime string indicating the date and time that the envelope will be sent. The specified datetime must occur in the future. It must not exceed 30 days from the time that the request is made.
          type: string
      description: 'A user-specified object that describes the envelope delay.


        To indicate a relative delay, use `delay`. To indicate the exact datetime the envelope should be sent, use `resumeDate`. Only one of the two properties can be used.'
      x-ds-definition-name: envelopeDelayRule
      x-ms-summary: 'A user-specified object that describes the envelope delay.


        To indicate a relative delay, use `delay`. To indicate the exact datetime the envelope should be sent, use `resumeDate`. Only one of the two properties can be used.'
    recipientGroup:
      type: object
      properties:
        groupMessage:
          description: The group message, typically a description of the group.
          type: string
        groupName:
          description: The name of the group.
          type: string
        recipients:
          description: An array of recipient objects that provides details about the recipients of the envelope.
          type: array
          items:
            $ref: '#/components/schemas/recipientOption'
      description: Describes a group of recipients.
      x-ds-definition-name: recipientGroup
      x-ms-summary: Describes a group of recipients.
    recipientRouting:
      type: object
      properties:
        rules:
          $ref: '#/components/schemas/recipientRules'
          description: The recipient routing rules.
      description: Describes the recipient routing rules.
      x-ds-definition-name: recipientRouting
      x-ms-summary: Describes the recipient routing rules.
    recipientRules:
      type: object
      properties:
        conditionalRecipients:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/conditionalRecipientRule'
      x-ds-definition-name: recipientRules
      description: ''
      x-ms-summary: ''
    workflowStep:
      type: object
      properties:
        action:
          description: 'Indicates the action to perform. Valid values:


            - `pause_before`: The workflow should pause before the trigger described by `triggerOnItem` is reached.

            '
          type: string
        completedDate:
          description: 'The timestamp of when the workflow step transitioned to `completed` status.


            This property is read-only.'
          type: string
        delayedRouting:
          $ref: '#/components/schemas/delayedRouting'
          description: A complex element that specifies the delayed routing settings for the workflow step.
        itemId:
          description: The unique ID of the item being triggered.
          type: string
        recipientRouting:
          $ref: '#/components/schemas/recipientRouting'
          description: The rules for recipient routing.
        status:
          description: 'The status of the step. Valid values:


            - `inactive`

            - `in_progress`

            - `paused`

            - `pending`

            - `completed`


            This property is read-only.'
          type: string
        triggeredDate:
          description: 'The timestamp of when the workflow step transitioned to `in_progress` status.


            This property is read-only.'
          type: string
        triggerOnItem:
          description: 'The type of item that triggers this workflow step. Valid values:


            * `routing_order`'
          type: string
        workflowStepId:
          description: 'A unique identifier for this workflow step.


            This property is read-only.'
          type: string
      description: Describes a single step in a workflow.
      x-ds-definition-name: workflowStep
      x-ms-summary: Describes a single step in a workflow.
    conditionalRecipientRule:
      type: object
      properties:
        conditions:
          description: An array of conditions that define when the recipients will be used.
          type: array
          items:
            $ref: '#/components/schemas/conditionalRecipientRuleCondition'
        order:
          description: 'An integer that specifies the order in which rules are processed.

            Lower values are processed before higher values.'
          type: string
        recipientGroup:
          $ref: '#/components/schemas/recipientGroup'
          description: A set of recipients that may be used for the envelope, depending on the `conditions` defined.
        recipientId:
          description: 'The ID of the recipient to whom the condition will be applied. This value should match the `recipientId` defined in the recipient object.

            '
          type: string
      description: A rule that defines a set of recipients and the conditions under which they will be used for the envelope.
      x-ds-definition-name: conditionalRecipientRule
      x-ms-summary: A rule that defines a set of recipients and the conditions under which they will be used for the envelope.
    delayedRouting:
      type: object
      properties:
        resumeDate:
          description: 'The ISO 8601 timestamp of when the envelope is scheduled to be sent to the recipients associated with the workflow step. This property is `null` if the workflow step has not been initiated.


            This property is read-only.

            '
          type: string
        rules:
          description: User-specified rules indicating how and when the envelope should sent for the workflow step and its associated recipients. Only one rule may be specified.
          type: array
          items:
            $ref: '#/components/schemas/envelopeDelayRule'
        status:
          description: 'Status of the delayed routing step. Valid values:


            * `pending`: The workflow step has not been reached and the delay has not been initiated.

            * `started`: The workflow step has begun and the delay is in progress. The envelope has not yet been sent to the workflow step''s recipients.

            * `completed`: The delay has elapsed and the envelope has been sent to the workflow step''s recipients.


            This property is read-only.'
          type: string
      x-ds-definition-name: delayedRouting
      description: A complex element that specifies the delayed routing settings for the workflow step.
      x-ms-summary: A complex element that specifies the delayed routing settings for the workflow step.
    errorDetails:
      description: This object describes errors that occur. It is only valid for responses and ignored in requests.
      type: object
      properties:
        errorCode:
          description: The code associated with the error condition.
          type: string
        message:
          description: A brief message describing the error condition.
          type: string
      x-ds-definition-name: errorDetails
      x-ms-summary: This object describes errors that occur. It is only valid for responses and ignored in requests.
    workflow:
      type: object
      properties:
        currentWorkflowStepId:
          description: 'The `workflowStepId` of the current step.

            This is not an index into the `workflowSteps` array in this object.

            See the `workflowStep` object.'
          type: string
        resumeDate:
          description: 'The ISO 8601 timestamp of when the envelope is scheduled to be sent, if applicable. Its value is the maximum of the `resumeDate` property on `scheduledSending` and the `resumeDate` property on the current `workflowStep`.


            This property is read-only.'
          type: string
        scheduledSending:
          $ref: '#/components/schemas/scheduledSending'
          description: An object that describes the settings for scheduled sending.
        workflowStatus:
          description: 'The status of the workflow:


            - `paused` if the workflow is paused

            - `in_progress` if the workflow is in progress'
          type: string
        workflowSteps:
          description: An array of workflow steps.
          type: array
          items:
            $ref: '#/components/schemas/workflowStep'
      description: Describes the workflow for an envelope.
      x-ds-definition-name: workflow
      x-ms-summary: Describes the workflow for an envelope.
    conditionalRecipientRuleCondition:
      type: object
      properties:
        filters:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/conditionalRecipientRuleFilter'
        order:
          description: 'An integer that specifies the order in which rules are processed.

            Lower values are processed before higher values.'
          type: string
        recipientLabel:
          description: 'An identifier for the recipient. After assigning this value in a `recipient` object, you can reference it in the `conditions` object to set the recipient as a conditional recipient. For an example, see [How to use conditional recipients](/docs/esign-rest-api/how-to/use-conditional-recipients/).

            '
          type: string
      x-ds-definition-name: conditionalRecipientRuleCondition
      description: ''
      x-ms-summary: ''
    recipientOption:
      type: object
      properties:
        email:
          description: 'The email ID of the agent. This property is required. Maximum length: 100 characters.'
          type: string
        name:
          description: 'The full legal name of the recipient. Maximum length: 100 characters.'
          type: string
        recipientLabel:
          description: 'An identifier for the recipient. After assigning this value in a `recipient` object, you can reference it in the `conditions` object to set the recipient as a conditional recipient. For an example, see [How to use conditional recipients](/docs/esign-rest-api/how-to/use-conditional-recipients/).

            '
          type: string
        roleName:
          description: Specifies the signing group role of the recipient. This property is required.
          type: string
        signingGroupId:
          description: 'The ID of the [signing group](https://support.docusign.com/s/document-item?bundleId=gav1643676262430&topicId=zgn1578456447934.html).

            '
          type: string
      description: Describes a recipient who is a member of a conditional group.
      x-ds-definition-name: recipientOption
      x-ms-summary: Describes a recipient who is a member of a conditional group.
    conditionalRecipientRuleFilter:
      type: object
      properties:
        operator:
          description: 'How the tab value is compared to the `value` property. Valid values:


            * `equals`

            * `greaterThan`

            * `greaterThanEquals`

            * `lessThan`

            * `lessThanEquals`

            * `filled`

            * `selected`'
          type: string
        recipientId:
          description: 'A local reference used to map

            recipients to other objects, such as specific

            document tabs.


            A `recipientId` must be

            either an integer or a GUID,

            and the `recipientId` must be

            unique within an envelope.


            For example, many envelopes assign the first recipient

