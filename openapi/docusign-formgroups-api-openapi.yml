          application/*+xml:
            schema:
              $ref: '#/components/schemas/FormGroupForCreate'
        required: false
      responses:
        '201':
          description: Successfully created form group.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/FormGroup'
            application/json:
              schema:
                $ref: '#/components/schemas/FormGroup'
            text/json:
              schema:
                $ref: '#/components/schemas/FormGroup'
            application/xml:
              schema:
