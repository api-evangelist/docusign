openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Template Document Responsive Html…
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: TemplateDocumentResponsiveHtmlPreview
  description: '**Note:** Responsive Signing is disabled by default. To use this functionality, an account administrator must switch the account setting `enableResponsiveSigning` to **true.**

    Also note that Smart Sections (creating a signable HTML document that uses collapsible sections and rotating tables) are premium features. To request them, contact your Docusign account manager.'
paths:
  /v2.1/accounts/{accountId}/templates/{templateId}/documents/{documentId}/responsive_html_preview:
    parameters: []
    post:
      tags:
      - TemplateDocumentResponsiveHtmlPreview
      summary: Creates a preview of the responsive version of a template document
      operationId: ResponsiveHtml_PostTemplateDocumentResponsiveHtmlPreview
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: documentId
        in: path
        description: 'The unique ID of the document within the envelope.


          Unlike other IDs in the eSignature API,

          you specify the `documentId` yourself.

          Typically the first document has the ID

          `1`, the second document `2`, and so on,

          but you can use any numbering scheme

          that fits within a 32-bit signed integer

          (1 through 2147483647).



          Tab objects have a `documentId` property

          that specifies the document on which to place

          the tab.

          '
        required: true
        schema:
          type: string
      - name: templateId
        in: path
        description: The ID of the template.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/documentHtmlDefinitions'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createTemplateDocumentResponsiveHtmlPreview
      description: 'Creates a preview of the

        responsive,

        HTML version of a specific template document. This

        method enables you to preview a PDF document

        conversion to responsive HTML across device types

        prior to sending.


        The request body is a `documentHtmlDefinition`

        object, which holds the responsive signing

        parameters that define how to generate the HTML

        version of the signing document.'
      x-ds-method: create
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/documentHtmlDefinition'
          application/xml:
            schema:
              $ref: '#/components/schemas/documentHtmlDefinition'
components:
  schemas:
    documentHtmlDefinition:
      type: object
      properties:
        displayAnchorPrefix:
          description: Contains text that all display anchors must start with. Using at least four characters will improve anchor processing performance.
          type: string
        displayAnchors:
          description: 'An object that defines how to handle a section of the HTML in signing. This property enables an incoming request to make a section of the HTML collapsible and expandable or hidden from view.


            A start anchor, end anchor, or both are required.

            If the anchors are not found, the display anchor will be ignored.


            For a list of the available types, see the

            [`display` property](/docs/esign-rest-api/reference/envelopes/envelopes/create/#schema__envelopedefinition_documents_htmldefinition_displayanchors_displaysettings_display)

            of the

            [`displaySettings` object.](/docs/esign-rest-api/reference/envelopes/envelopes/create/#schema__envelopedefinition_documents_htmldefinition_displayanchors_displaysettings)'
          type: array
          items:
            $ref: '#/components/schemas/documentHtmlDisplayAnchor'
        displayOrder:
          description: The position on the page where the display section appears.
          type: string
        displayPageNumber:
          description: The number of the page on which the display section appears.
          type: string
        documentGuid:
          description: The GUID of the document.
          type: string
        documentId:
          description: Specifies the document ID number that the tab is placed on. This must refer to an existing Document's ID attribute.
          type: string
        headerLabel:
          description: Header text or an HTML tag to place above the responsive HTML block.
          type: string
        maxScreenWidth:
          description: 'If set, the responsive HTML version of the signing document will only display on screens with the specified pixel width or less. If the screen is larger than the value that you specify, the default PDF version of the content displays instead.


            This setting can also be configured at the account level.

            '
          type: string
        removeEmptyTags:
          description: Holds a comma-separated list of HTML tags to remove if they have no text within their node (including child nodes).
          type: string
        showMobileOptimizedToggle:
          description: 'When **true** (the default), the **Mobile-Friendly** toggle displays at the top of the screen on the user''s mobile device. When **false,** the toggle will not be displayed.


            the **Mobile-Friendly** toggle lets the user switch between the mobile-friendly and the PDF versions of a document. For example, the recipient can use this toggle to review the document using the PDF view before they finish signing.

            '
          type: string
        source:
          description: 'Specifies the type of responsive signing that will be used with the document.


            If the value of this property is valid HTML,

            and the [smart sections feature][] is enabled,

            the HTML code is used to display the signing page:


            ```

            source: "<html> ... <body><p>hello world</p></body></html>"

            ```


            If the value of this property is the string `document`,

            the HTML signing page is generated from the provided document.


            ```

            source: "document"

            ```


            **Related topics**


            - [How to create a signable HTML document](/docs/esign-rest-api/how-to/creating-signable-html/)

            - [How to convert a PDF file into a signable HTML document](/docs/esign-rest-api/how-to/converting-pdf/)

            - [Responsive signing](/docs/esign-rest-api/esign101/concepts/responsive/)



            [smart sections feature]: https://support.docusign.com/s/document-item?bundleId=gbo1643332197980&topicId=qlx1578456478178.html'
          type: string
      description: 'Holds the properties that define how to generate the responsive-formatted HTML for the document.

        See [Responsive signing](/docs/esign-rest-api/esign101/concepts/responsive/)

        in the [eSignature concepts guide](/docs/esign-rest-api/esign101/concepts/).'
      x-ds-definition-name: documentHtmlDefinition
      x-ms-summary: 'Holds the properties that define how to generate the responsive-formatted HTML for the document.

        See [Responsive signing](/docs/esign-rest-api/esign101/concepts/responsive/)

        in the [eSignature concepts guide](/docs/esign-rest-api/esign101/concepts/).'
    documentHtmlDisplayAnchor:
      type: object
      properties:
        caseSensitive:
          description: When **true,** the start or end anchor strings must match the strings specified by the start and end anchor settings in case as well as in content.
          type: boolean
        displaySettings:
          $ref: '#/components/schemas/documentHtmlDisplaySettings'
          description: This object defines how the HTML section inside the `startAnchor` and `endAnchor` displays.
        endAnchor:
          description: 'Specifies the end of the area in the HTML where the display settings will be applied. If you do not specify an end anchor, the end of the document will be used by default.


            **Note:** A start anchor, an end anchor, or both are required.'
          type: string
        removeEndAnchor:
          description: When **true,** removes the end anchor string for the Smart Section from the HTML, preventing it from displaying.
          type: boolean
        removeStartAnchor:
          description: When **true,** removes the start anchor string for the Smart Section from the HTML, preventing it from displaying.
          type: boolean
        startAnchor:
          description: 'Specifies the beginning of the area in the HTML where the display settings will be applied. If you do not specify a start anchor, the beginning of the document will be used by default.


            **Note:** A start anchor, an end anchor, or both are required.'
          type: string
      x-ds-definition-name: documentHtmlDisplayAnchor
      description: ''
      x-ms-summary: ''
    errorDetails:
      description: This object describes errors that occur. It is only valid for responses and ignored in requests.
      type: object
      properties:
        errorCode:
          description: The code associated with the error condition.
          type: string
        message:
          description: A brief message describing the error condition.
          type: string
      x-ds-definition-name: errorDetails
      x-ms-summary: This object describes errors that occur. It is only valid for responses and ignored in requests.
    documentHtmlDefinitions:
      type: object
      properties:
        htmlDefinitions:
          description: Holds the properties that define how to generate the responsive-formatted HTML for the document.
          type: array
          items:
            type: string
      x-ds-definition-name: documentHtmlDefinitions
      description: ''
      x-ms-summary: ''
    documentHtmlCollapsibleDisplaySettings:
      type: object
      properties:
        arrowClosed:
          description: 'Indicates the direction of the disclosure arrow

            when the collapsible section is in the closed state.


            One of the following:


            - `up`: In the closed state, the disclosure arrow points up.

            - `down`: In the closed state, the disclosure arrow points down.

            - `left`: In the closed state, the disclosure arrow points left.

            - `right`: In the closed state, the disclosure arrow points right.

            '
          type: string
        arrowColor:
          description: 'A CSS color value (such as `#DCF851`) that indicates the color of the arrow.

            '
          type: string
        arrowLocation:
          description: 'The location of the arrow relative to the collapsible section''s label. Possible values are:


            - `right` (default)

            - `left`

            '
          type: string
        arrowOpen:
          description: 'Indicates the direction of the disclosure arrow

            when the collapsible section is in the open state.


            One of the following:


            - `up`: In the open state, the disclosure arrow points up.

            - `down`: In the open state, the disclosure arrow points down.

            - `left`: In the open state, the disclosure arrow points left.

            - `right`: In the open state, the disclosure arrow points right.

            '
          type: string
        arrowSize:
          description: 'Indicates the size of the collapsible arrows. Possible values are:


            - `small`

            - `large` (default)

            '
          type: string
        arrowStyle:
          description: 'The name of the CSS style to be used on collapsible arrow section.

            '
          type: string
        containerStyle:
          description: 'The name of the CSS style to be used for the collapsible container.

            '
          type: string
        labelStyle:
          description: The name of the CSS style to be used for the collapsible container's label.
          type: string
        onlyArrowIsClickable:
          description: 'When **true,** only the arrow is clickable to expand or collapse the section.

            When **false** (the default), both the label and the arrow are clickable.


            If no arrow is used, this setting is ignored.

            '
          type: boolean
        outerLabelAndArrowStyle:
          description: The name of the CSS style to be used for the collapsible container's outer label and arrow style.
          type: string
      description: Display settings for collapsible section.
      x-ds-definition-name: documentHtmlCollapsibleDisplaySettings
      x-ms-summary: Display settings for collapsible section.
    documentHtmlDisplaySettings:
      type: object
      properties:
        cellStyle:
          description: Specifies the valid CSS-formatted styles to use on responsive table cells. Only valid in display sections of `responsive_table` or `responsive_table_single_column` types.
          type: string
        collapsibleSettings:
          $ref: '#/components/schemas/documentHtmlCollapsibleDisplaySettings'
          description: This object defines the appearance and function of a collapsible section or item.
        display:
          description: "Sets the display and behavior properties. Possible  values are:\n\n- `inline`:\n  Leaves the HTML where it is in the document.\n  This property lets you add a label or present on a separate page.\n\n- `collapsible`:\n  The HTML in this section may be expanded or collapsed.\n  Initially this section is expanded.\n\n- `collapsed`:\n  The HTML in this section may be expanded or collapsed.\n  Initially this section is collapsed.\n\n- `continue_button`:\n  Creates a stop point in the document to draw the reader's\n  attention before proceeding to the next section.\n\n- `responsive_table`:\n  Turns this section into a responsive table.\n  Note that this is only used on HTML tables that fall within the anchor start and end positions.\n\n- `responsive_table_single_column`:\n  Turns this section into a responsive single-column table.\n  Note this is only used on HTML tables that fall within the anchor start and end positions.\n  The table will be converted to one single column where each current column will become a row, then stacked.\n\n- `print_only`:\n  Do not show this portion of the HTML in the responsive signing view.\n\n\n"
          type: string
        displayLabel:
          description: 'The label to add to this display section in the signing page.

            '
          type: string
        displayOrder:
          format: int32
          description: The position on the page where the display section appears.
          type: integer
        displayPageNumber:
          format: int32
          description: The number of the page on which the display section appears.
          type: integer
        hideLabelWhenOpened:
          description: When **true,** the `displayLabel` is hidden when the display section is expanded and the display section is no longer collapsible. This property is valid only when the value of the `display` property is `collapsed`.
          type: boolean
        inlineOuterStyle:
          description: Specifies the valid CSS-formatted styles to use on inline display sections. This property is valid only when the value of the `display` property is `inline`.
          type: string
        labelWhenOpened:
          description: The label for the display section when it is expanded from a collapsed state. This label displays only on the first opening and is only valid with the value of the `display` property is `collapsed`.
          type: string
        preLabel:
          description: Enables you to add descriptive text that appears before a collapsed section or continue button.
          type: string
        scrollToTopWhenOpened:
          description: 'When **true** and the section is expanded,

            the position of the section-close control

            scrolls to the top of the screen. This property is only valid when the value of the `display` property is `collapsed`.

            '
          type: boolean
        tableStyle:
          description: Specifies the valid CSS-formatted styles to use on responsive tables. This property is valid only when the value of the `display` property is `responsive_table` or `responsive_table_single_column`.
          type: string
      x-ds-definition-name: documentHtmlDisplaySettings
      description: 'This object defines how to display the HTML

        between the `startAnchor` and `endAnchor`.'
      x-ms-summary: 'This object defines how to display the HTML

        between the `startAnchor` and `endAnchor`.'
externalDocs:
  description: See the Docusign eSignature REST API Guide for more information.
  url: https://docs.docusign.com/esign
x-ds-allow-editing: false
x-ds-categories:
- name: Envelopes
  summary: This section shows you how to create and send envelopes.
  description: 'The eSignature API Envelope category includes the resources and methods for sending and managing envelopes and envelope data.


    Envelopes are the key objects in the Docusign platform. As a result, they are complex data structures with few required fields. See the [How-to guides](/docs/esign-rest-api/how-to/) for examples and solutions.


    To learn more about envelopes, see [Envelopes](/docs/esign-rest-api/esign101/concepts/envelopes/).

    '
- name: Connect
  summary: "Docusign Connect is the Docusign platform notification service. The service uses webhooks to proactively notify your application when an event occurs that your application wants to know about. Docusign recommends that all applications use Connect instead of polling the Docusign Signature Service. This section provides information about Connect configuration and logging. \n\n**Note:** To make API calls to any of the Connect endpoints, you must be an account administrator.\n\nFor more information about Connect, see [Docusign Connect](/platform/webhooks/connect/) and [Custom Connect Configuration](https://support.docusign.com/s/document-item?bundleId=pik1583277475390&topicId=khw1583277390582.html)."
  description: 'The Connect service enables your application to be called via

    HTTPS when an event of interest occurs.


    Use the Connect service to "end the polling madness." With

    Connect, there is no need for your application to poll Docusign

    every 15 minutes to learn the latest about your envelopes.


    Instead, you register your interest in one or more types of

    envelope or recipient events. Then, when an interesting event

    occurs, the Docusign platform will contact your application with

    the event''s details and data. You can register interest in

    envelopes sent by particular users in your account, or for

    envelopes sent by any user.


    Connect can empower your organization to manage document actions

    as they occur, and allows you to track their changes within your

    own systems. Upon completion, envelope information, including

    document content, can be stored in your own databases or CMS

    systems, and these events can be triggered via webhooks

    delivering messages to your application.


    **Note:** To make API calls to any of the Connect endpoints, you must be an account administrator.


    ## Incoming Connect Calls


    To use the Connect service, your application needs to provide an

    HTTPS URL that can be called from the public Internet. If your

    application runs on a server behind your organization''s firewall,

    then you will need to create a "pinhole" in the firewall to allow

    the incoming Connect calls from Docusign to reach your

    application. You can also use other techniques such as proxy

    servers and DMZ networking for receiving the incoming calls.


    Connect delivers events over HTTP requests in JSON or XML.

    See [Docusign Connect overview](/platform/webhooks/connect/).


    If your application is not configured to accept post messages,

    Docusign will NOT return an additional post error response to

    your listener application. If you''ve enabled logging on your

    configuration, it will be logged in Admin under the configuration

    failure log.


    ## Per-envelope Connect Configuration


    Instead of registering a general Connect configuration and

    listener, an individual envelope can have its own Connect

    configuration. See the

    [`eventNotification`](/docs/esign-rest-api/reference/envelopes/envelopes/create/#schema__envelopedefinition_eventnotification)

    property for envelopes.


    ## Historical Publish Endpoint


    To submit existing envelopes to an endpoint, use the [EnvelopePublish](/docs/esign-rest-api/reference/envelopes/envelopepublish/) resource.

    '
- name: Templates
  summary: Template creation and management
  description: 'Use the Templates category to manage your account''s templates.


    This section shows you how to perform the following tasks:


    * Create, list, get, update, and delete templates.

    * Manage the notification and group sharing settings for templates.

    * Fetch and rotate pages from a document used by a template.


    You can create templates either programmatically or through the Docusign web interface and then used by your application.'
- name: SigningGroups
  summary: Send a signing request to a group of potential signers.
  description: 'Use the Signing Group category to manage signing groups that allow anyone in the group to sign a document. When you send an envelope to a signing group, anyone in the group can open it and sign it with their own signature.


    This category shows account administrators how to create a signing group and manage the users in the group.


    **Note:** To create and manage signing groups, you must be an account administrator.


    For more information about this topic, see [Signing Groups](https://support.docusign.com/s/document-item?bundleId=gav1643676262430&topicId=zgn1578456447934.html).'
- name: Folders
  summary: Folders allow you to organize envelopes and templates.
  description: 'Use the Folders category to organize envelopes and templates.

    You can list the folder contents and move envelopes and templates between folders.'
- name: CustomTabs
  summary: Custom tabs
  description: "Custom Tabs enable accounts to have one or more pre-configured (custom) tabs. Custom tabs save time when users are tagging documents since the users don't have to manually set the tabs' parameters.\n\nThis category enables custom tabs to be managed programmatically, including creation, deletion, etc. \n"
- name: CloudStorage
  summary: This section shows you how to manage your cloud storage providers and users.
  description: 'Use the Cloud Storage category to list the user''s cloud storage document contents.


    It is also used to manage the user''s authentication/accounts with cloud storage service providers.'
- name: Users
  summary: User management
  description: 'Use the Users category to manage the users in your accounts.


    You can:


    * Set custom user settings.

    * Manage a users profile.

    * Add delete users.

    * Add and delete the initials and signature images for a user.'
- name: UserGroups
  summary: Group users for common permissions and branding
  description: 'Use the User Groups category to manage your permissions groups.


    You can:


    * Create and delete groups.

    * Add users to, and delete users from, your groups.

    * Manage the brand information associated with a group.'
- name: BulkEnvelopes
  summary: Bulk envelopes
  description: Use the BulkEnvelopes category to manage the sending of envelopes to multiple recipients.
- name: Accounts
  summary: Account management
  description: 'Use the Account category for various account management tasks including:


    * Programmatically creating and deleting accounts.

    * Getting information about an account and its capabilities.

    * Branding the account with custom colors, message text, and more.

    * Account charges.


    The Accounts category also includes end points for listing the recipient names associated with an email address that was used by the account. For example, a single email address is often shared by multiple members of a family.



    '
- name: Billing
  summary: Invoices
  description: 'Use the Billing category to manage the following billing related tasks:


    * Retrieve and update billing plan information.

    * Retrieve invoices.

    * Retrieve and update payment information.'
- name: Diagnostics
  summary: Diagnostics and request logging
  description: 'The Diagnostics category provides miscellaneous end points.


    They include:

    * Requesting and managing the API call-logging feature. (Perfect for debugging your app!)

    * Getting information on the API''s resources and versions.'
- name: PowerForms
  summary: The PowerForms category provides methods that enable you to create and manage fillable forms.
  description: The PowerForms category enables you to create and manage PowerForms that you can use for self service and email forms.
- name: Workspaces
  summary: A Docusign workspace is a collaboration area for sharing files and data.
  description: "A workspace is a collaborative space for sharing documents and managing workflows. A workspace has a single owner who must be a Docusign user. The owner can invite others to the workspace as collaborators. Individuals who are not Docusign users must create a Docusign account to join a workspace as a collaborator.\n \nYou can create an envelope directly from a workspace.\n\nWorkspaces store the following information:\n\n- **Files:** Files uploaded to a workspace for storage or reuse.\n- **Documents:** A document is a component of a transaction, template, or workspace. When a file is added to a transaction, template, or workspace, it is copied as a document. Each document in a workspace has a single owner.\n- **Templates:** A set of documents that you can use to create a transaction or a workspace.\n- **Transactions:** A transaction is a series of workflow events related to one or more documents. These events route the documents to one or more individuals for the purposes of doing business. Each transaction has a single owner (the sender).\n\n**Note:** Documents in a template are not individually listed as files."
- name: Payments
  summary: Manage Payments
  description: This category includes resources for managing payment gateways. Payment information is added to envelopes via methods in the Envelopes category.
- name: EmailArchive
  summary: This section shows you how to set and manage the BCC email addresses that you want to use to archive the emails that Docusign sends.
  description: 'Email archives enable Docusign partners and other multi-account customers to easily archive emails sent through Docusign. The `EmailArchive` resource provides methods for managing your email archive configuration, which consists of the BCC email address or addresses that you want to use to archive Docusign emails. Each account can use up to five BCC email addresses for archiving purposes.


    For more information, see [Email Archive Configuration](https://support.docusign.com/s/document-item?bundleId=pik1583277475390&topicId=xjm1583277371373.html).


    **Note:** This feature is only available for certain account plans and must be enabled by Docusign.'
- name: Notary
  summary: 'Docusign eNotary makes the notarization process fully digital

    for senders, signers, and notaries.

    It enables a notary public to act as an in-person witness

    to electronic signing of documents.

    '
  description: 'Docusign eNotary makes the notarization process fully digital

    for senders, signers, and notaries.

    It enables a notary public to act as an in-person witness

    to electronic signing of documents.

    '
