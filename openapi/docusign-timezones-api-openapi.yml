      x-ds-in-sdk: true
components:
  schemas:
    TimeZone:
      type: object
      properties:
        timeZoneId:
          type: string
          description: 'The ID of the time zone.


            Example: `brisbane`'
        name:
          type: string
          description: 'The name of the time zone.


            Example: `Eastern Australia (Brisbane)`'
      description: Contains information about a time zone.
      x-ds-definition-name: TimeZone
      x-ms-summary: Contains information about a time zone.
    ApiError:
