paths:
  /v2/time_zones:
    get:
      tags:
      - TimeZones
      summary: Docusign Gets time zones.
      description: 'Gets a list of time zones that you can assign to an office.


        **Note:** You do not specify an `accountId` with this method.


        ## Permissions


        Anyone with a valid access token can call this method.'
      operationId: TimeZones_GetTimeZones
      responses:
        '200':
          description: Request was successful.
          content:
            text/plain:
