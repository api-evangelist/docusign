    GlobalTimeZones:
      type: object
      properties:
        timeZones:
          type: array
          description: A list of time zones.
          items:
            $ref: '#/components/schemas/TimeZone'
      description: Contains a list of time zones.
      x-ds-definition-name: GlobalTimeZones
      x-ms-summary: Contains a list of time zones.
