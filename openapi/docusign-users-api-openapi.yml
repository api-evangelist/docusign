openapi: 3.2.0
info:
  title: Docusign Users API
  version: '1.0'
  description: 'Operations tagged Users across 3 of this provider''s published API definitions: docusign-admin-openapi-original.yml, docusign-openapi.json, docusign-users-api-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.docusign.net/Management
- url: https://www.docusign.net/restapi
- url: https://rooms.docusign.com/restapi
tags:
- name: Users
  description: Methods to manage users in an account.
paths:
  /v2/organizations/{organizationId}/users/email_addresses:
    post:
      tags:
      - Users
      summary: Docusign Updates a user's email address
      description: 'Updates a user''s email address.


        - Required scopes: `user_write`'
      operationId: User_Users_UpdateEmailAddressesV2
      parameters:
      - name: organizationId
        in: path
        description: The organization ID Guid
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUsersEmailRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsersUpdateResponse'
      security:
      - accessCode:
        - user_write
      x-ds-methodname: updateEmailAddress
      x-ds-method: updateEmailAddress
      x-ds-service: Users
      x-ds-in-sdk: true
      x-codegen-request-body-name: request
    servers:
    - url: https://api.docusign.net/Management
  /v2/organizations/{organizationId}/users:
    get:
      tags:
      - Users
      summary: Docusign Returns information about the users in an organization
      description: 'Returns information about the users in an organization.


        - Required scopes: `user_read`


        You must include at least one of the following query parameters in the request:


        - `account_id`: The id of an account associated with the organization.

        - `organization_reserved_domain_id`: The id of one of the organization''s reserved domains.

        - `email`: An email address associated with the users that you want to return.'
      operationId: OrganizationUser_OrganizationUsers_GetV2
      parameters:
      - name: organizationId
        in: path
        description: The organization ID Guid
        required: true
        schema:
          type: string
          format: uuid
      - name: start
        in: query
        description: Index of first item to include in the response. The default value is 0.
        schema:
          type: integer
          format: int32
      - name: take
        in: query
        description: Page size of the response. The default value is 20.
        schema:
          type: integer
          format: int32
      - name: end
        in: query
        description: Index of the last item to include in the response. Ignored if `take` parameter is specified.
        schema:
          type: integer
          format: int32
      - name: email
        in: query
        description: Email address of the desired user. At least one of `email`, `account_id` or `organization_reserved_domain_id` must be specified.
        schema:
          type: string
      - name: email_user_name_like
        in: query
        description: Selects users by pattern matching on the user's email address
        schema:
          type: string
      - name: status
        in: query
        description: Status.
        schema:
          type: string
      - name: membership_status
        in: query
        description: 'The user''s membership status. One of:


          - `activation_required`

          - `activation_sent`

          - `active`

          - `closed`

          - `disabled`

          '
        schema:
          type: string
      - name: account_id
        in: query
        description: Select users that are members of the specified account. At least one of `email`, `account_id` or `organization_reserved_domain_id` must be specified.
        schema:
          type: string
          format: uuid
      - name: organization_reserved_domain_id
        in: query
        description: Select users that are in the specified domain. At least one of `email`, `account_id` or `organization_reserved_domain_id` must be specified.
        schema:
          type: string
          format: uuid
      - name: last_modified_since
        in: query
        description: Select users whose data have been modified since the date specified. `account_id` or `organization_reserved_domain_id` must be specified.
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationUsersResponse'
      security:
      - accessCode:
        - user_read
      x-ds-methodname: getUsers
      x-ds-method: getUsers
      x-ds-service: Users
      x-ds-in-sdk: true
    servers:
    - url: https://api.docusign.net/Management
  /v2.1/accounts/{accountId}/users:
    parameters: []
    get:
      tags:
      - Users
      summary: Retrieves the list of users for the specified account.
      description: 'Retrieves the list of users for the specified account.


        The response returns the list of users for the account, with information about the result set. If the `additional_info` query is added to the endpoint and set to **true,** full user information is returned for each user.'
      operationId: Users_GetUsers
      parameters:
      - name: accountId
        in: path
        description: (Required) The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: additional_info
        in: query
        description: When **true,** the custom settings information is returned for each user in the account. If this parameter is omitted, the default behavior is **false.**
        required: false
        schema:
          type: string
      - name: alternate_admins_only
        in: query
        required: false
        description: When **true,** returns only alternate administrators. These users are not administrators but will be set as such if all administrator memberships are closed. The default value is **false.**
        schema:
          type: string
      - name: count
        in: query
        description: 'The maximum number of results to return.


          Use `start_position` to specify the number of results to skip.


          Valid values: `1` to `100`

          '
        required: false
        schema:
          type: string
      - name: domain_users_only
        in: query
        required: false
        description: When **true,** return only users in [domains](https://support.docusign.com/s/document-item?rsc_301=&bundleId=rrf1583359212854&topicId=jub1589318086105.html) claimed by your organization. The default value is **false.**
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: 'Filters results based on the email address associated with the user that you want to return.


          **Note:** You can use either this parameter or the `email_substring` parameter, but not both. For older accounts, this parameter might return multiple users who are associated with a single email address. '
        schema:
          type: string
      - name: email_substring
        in: query
        description: 'Filters results based on a fragment of an email address. For example, you could enter `gmail.com` to return all users who have Gmail addresses.


          **Note:** You do not use a wildcard character with this parameter. You can use either this parameter or the `email` parameter, but not both. '
        required: false
        schema:
          type: string
      - name: group_id
        in: query
        description: Filters results based on one or more group IDs.
        required: false
        schema:
          type: string
      - name: include_license
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: include_usersettings_for_csv
        in: query
        required: false
        description: When **true,** the response includes the `userSettings` object data in CSV format.
        schema:
          type: string
      - name: login_status
        in: query
        required: false
        description: When **true,** the response includes the login status of each user.
        schema:
          type: string
      - name: not_group_id
        in: query
        required: false
        description: Return user records excluding the specified group IDs.
        schema:
          type: string
      - name: start_position
        in: query
        description: 'The zero-based index of the

          result from which to start returning results.


          Use with `count` to limit the number

          of results.


          The default value is `0`.

          '
        required: false
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 'Filters results by user account status.

          A comma-separated list of any of the following:


          * `ActivationRequired`

          * `ActivationSent`

          * `Active`

          * `Closed`

          * `Disabled`

          '
        schema:
          type: string
      - name: user_name_substring
        in: query
        description: Filters the user records returned by the user name or a sub-string of user name.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userInformationList'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: list
      x-ds-method: list
      x-ds-service: Users
      x-ds-in-sdk: true
    put:
      tags:
      - Users
      summary: Changes one or more users in the specified account
      operationId: Users_PutUsers
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: allow_all_languages
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userInformationList'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateUsers
      description: This method updates the information about one or more account users.
      x-ds-method: updateList
      x-ds-service: Users
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userInformationList'
          application/xml:
            schema:
              $ref: '#/components/schemas/userInformationList'
    post:
      tags:
      - Users
      summary: Adds new users to the specified account
      description: 'Adds new users to an account.


        The body of this request is an array of `newUsers` objects. For each new user, you must provide at least the `userName` and `email` properties. The maximum number of users you can create in one request is 500 users.


        The `userSettings` property specifies the actions users can perform. In the example below, Tal Mason will be able to send envelopes, and the activation email will be in French because the `locale` is set to `fr`.


        ```

        POST /restapi/v2.1/accounts/{accountId}/users

        Content-Type: application/json

        ```

        ```

        {

        "newUsers": [

        {

        "userName": "Claire Horace",

        "email": "claire@example.com"

        },

        {

        "userName": "Tal Mason",

        "email": "talmason@example.com",

        "company": "TeleSel",

        "userSettings": {

        "locale": "fr",

        "canSendEnvelope": true

        }

        }

        ]

        }

        ```


        A successful response is a `newUsers` array with information about the newly created users. If there was a problem in creating a user, that user entry will contain an `errorDetails` property that describes what went wrong.


        ```json

        {

        "newUsers": [

        {

        "userId": "18f3be12-xxxx-xxxx-xxxx-883d8f9b8ade",

        "uri": "/users/18f3be12-xxxx-xxxx-xxxx-883d8f9b8ade",

        "email": "claire@example.com",

        "userName": "Claire Horace",

        "createdDateTime": "0001-01-01T08:00:00.0000000Z",

        "errorDetails": {

        "errorCode": "USER_ALREADY_EXISTS_IN_ACCOUNT",

        "message": "Username and email combination already exists for this account."

        }

        },

        {

        "userId": "be9899a3-xxxx-xxxx-xxxx-2c8dd7156e33",

        "uri": "/users/be9899a3-xxxx-xxxx-xxxx-2c8dd7156e33",

        "email": "talmason@example.com",

        "userName": "Tal Mason",

        "userStatus": "ActivationSent",

        "createdDateTime": "2020-05-26T23:25:30.7330000Z"

        }

        ]

        }

        ```'
      operationId: Users_PostUsers
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/newUsersSummary'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: create
      x-ds-method: create
      x-ds-service: Users
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/newUsersDefinition'
          application/xml:
            schema:
              $ref: '#/components/schemas/newUsersDefinition'
    delete:
      tags:
      - Users
      summary: Closes one or more users in the account
      description: 'Closes one or more users in the account,

        preventing them from accessing account features.

        Users are not permanently deleted.


        The request body requires only

        the IDs of the users to close:


        ```json

        {

        "users": [

        { "userId": "6b67a1ee-xxxx-xxxx-xxxx-385763624163" },

        { "userId": "b6c74c52-xxxx-xxxx-xxxx-457a81d88926" },

        { "userId": "464f7988-xxxx-xxxx-xxxx-781ee556ab7a" }

        ]

        }

        ```


        You can use `Users:update`

        to re-open a closed user.'
      operationId: Users_DeleteUsers
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: delete
        in: query
        required: false
        description: 'A list of groups to remove the user from.

          A comma-separated list of the following:


          - `Groups`

          - `PermissionSet`

          - `SigningGroupsEmail`'
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/usersResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: delete
      x-ds-method: delete
      x-ds-service: Users
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userInfoList'
          application/xml:
            schema:
              $ref: '#/components/schemas/userInfoList'
    servers:
    - url: https://www.docusign.net/restapi
  /v2.1/accounts/{accountId}/users/{userId}:
    parameters: []
    get:
      tags:
      - Users
      summary: Gets the user information for a specified user using a userId (GUID).
      description: 'Retrieves the user information for the specified user. For example:


        ```json

        {

        "userName": "Tania Morales",

        "userId": "6b67a1ee-xxxx-xxxx-xxxx-385763624163",

        "userType": "CompanyUser",

        "isAdmin": "False",

        "isNAREnabled": "false",

        "userStatus": "Active",

        "uri": "/users/6b67a1ee-xxxx-xxxx-xxxx-385763624163",

        "email": "examplename42@orobia.net",

        "createdDateTime": "2019-04-01T22:11:56.4570000Z",

        "userAddedToAccountDateTime": "0001-01-01T08:00:00.0000000Z",

        "firstName": "Tania",

        "lastName": "Morales",

        "jobTitle": "",

        "company": "Company",

        "permissionProfileId": "12345678",

        "permissionProfileName": "DocuSign Viewer",

        "userSettings": {. . .},

        "sendActivationOnInvalidLogin": "false",

        "enableConnectForUser": "false",

        "groupList": [. . .],

        "workAddress": {. . .},

        "homeAddress": {. . .},

        "signatureImageUri": "/users/6b67a1ee-xxxx-xxxx-xxxx-385763624163/signatures/0304c47b-xxxx-xxxx-xxxx-c9673963bb50/signature_image",

        "initialsImageUri": "/users/6b67a1ee-xxxx-xxxx-xxxx-385763624163/signatures/0304c47b-xxxx-xxxx-xxxx-c9673963bb50/initials_image",

        "defaultAccountId": "f636f297-xxxx-xxxx-xxxx-8e7a14715950"

        }

        ```'
      operationId: User_GetUser
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
      - name: additional_info
        in: query
        description: Setting this parameter has no effect in this operation.
        required: false
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: Setting this parameter has no effect in this operation.
        schema:
          type: string
      - name: include_license
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getInformation
      x-ds-method: get
      x-ds-service: Users
      x-ds-in-sdk: true
    put:
      tags:
      - Users
      summary: Updates user information for the specified user
      operationId: User_PutUser
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
      - name: allow_all_languages
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateUser
      description: To update user information for a specific user, submit a Users object with updated field values in the request body of this operation.
      x-ds-method: update
      x-ds-service: Users
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/userInformation'
    servers:
    - url: https://www.docusign.net/restapi
  /v2.1/accounts/{accountId}/users/{userId}/profile/image:
    parameters: []
    get:
      tags:
      - Users
      summary: Retrieves the user profile image for the specified user
      description: 'Retrieves the user profile picture for the specified user.


        The `userId` path parameter must match the authenticated user''s user ID,

        and the user must be a member of the specified account.


        | Return value | Meaning |

        | :---------------- | :----------------------------------------------------------------------------- |

        | `200 OK` | The response contains the profile image in the same format as it was uploaded. |

        | `404 Not found` | The user does not have a profile image. |

        | `400 Bad request` | There was an error in the request. The response has more information. |'
      operationId: UserProfileImage_GetUserProfileImage
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
      - name: encoding
        in: query
        required: false
        description: Reserved for Docusign.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            image/gif:
              schema:
                type: string
                format: binary
        '400':
          description: Error encountered.
          content:
            image/gif:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getProfileImage
      x-ds-method: getProfileImage
      x-ds-service: Users
      x-ds-in-sdk: true
    put:
      tags:
      - Users
      summary: Updates the user profile image for a specified user
      description: 'Updates the user profile image by uploading an image to the user profile.


        The supported image formats are: gif, png, jpeg, and bmp. The file must be less than 200K. For best viewing results, Docusign recommends that the image is no more than 79 pixels wide and high.'
      operationId: UserProfileImage_PutUserProfileImage
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateProfileImage
      x-ds-method: updateProfileImage
      x-ds-service: Users
      x-ds-in-sdk: true
    delete:
      tags:
      - Users
      summary: Deletes the user profile image for the specified user
      description: 'Deletes the user profile image from the specified user''s profile.


        The userId parameter specified in the endpoint must match the authenticated user''s user ID and the user must be a member of the specified account.'
      operationId: UserProfileImage_DeleteUserProfileImage
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteProfileImage
      x-ds-method: deleteProfileImage
      x-ds-service: Users
      x-ds-in-sdk: true
    servers:
    - url: https://www.docusign.net/restapi
  /v2.1/accounts/{accountId}/users/{userId}/settings:
    parameters: []
    get:
      tags:
      - Users
      summary: Gets the user account settings for a specified user
      description: 'Retrieves a list of the account settings and email

        notification information for the specified user.


        The response returns the account setting

        name/value information and the email notification

        settings for the specified user. For more

        information, see

        Users:create.'
      operationId: UserSettings_GetUserSettings
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userSettingsInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getSettings
      x-ds-method: getSettings
      x-ds-service: Users
      x-ds-in-sdk: true
    put:
      tags:
      - Users
      summary: Updates the user account settings for a specified user
      description: Updates the account settings list and email notification types for the specified user.
      operationId: UserSettings_PutUserSettings
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: 'The ID of the user to access.


          **Note:** Users can only access their own information. A user, even one with Admin rights, cannot access another user''s settings.'
        required: true
        schema:
          type: string
