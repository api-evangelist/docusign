          items:
            $ref: '#/components/schemas/OriginOfLead'
      description: Contains a list of origins of leads.
      x-ds-definition-name: GlobalOriginsOfLeads
      x-ms-summary: Contains a list of origins of leads.
    OriginOfLead:
      type: object
      properties:
        originOfLeadId:
          type: string
          description: 'The ID of the origin of lead.


            Example: `tru` (for `Trulia`)'
        name:
          type: string
          description: 'The name of the origin of lead. Possible values are:


            - `Realtor.com`

            - `Trulia`

            - `Zillow`

            - `Company Website`

            - `Agent Website`

            - `Other Online`

            - `Mobile App`

            - `Social Media`

            - `Personal Referral`

            - `Company Referral`

            - `Repeat Client`

            - `Corporate Relocation`

            - `Print Marketing`

            - `Prospecting`

            - `Other`

            - `REO (Real Estate Owned)`'
      description: Contains information about an origin of lead.
      x-ds-definition-name: OriginOfLead
      x-ms-summary: Contains information about an origin of lead.
