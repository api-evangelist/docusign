paths:
  /v2/origins_of_leads:
    get:
      tags:
      - OriginsOfLeads
      summary: Docusign Gets origins of leads.
      description: 'Returns a list of origins of leads (such as Trulia or Zillow) that you can specify for rooms.


        ## Permissions


        Anyone with a valid access token can call this method.'
      operationId: OriginsOfLeads_GetOriginsOfLeads
      responses:
        '200':
          description: Request was successful.
          content:
            text/plain:
