openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Envelope Publish API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: EnvelopePublish
  description: The EnvelopePublish resource provides a method for submitting existing envelopes to a webhook using an ad hoc Connect configuration. See the Connect category for related endpoints.
paths:
  /v2.1/accounts/{accountId}/connect/envelopes/publish/historical:
    parameters: []
    post:
      tags:
      - EnvelopePublish
      summary: Submits a batch of historical envelopes for republish to a webhook
      operationId: HistoricalEnvelopePublish_PostHistoricalEnvelopePublishTransaction
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/envelopePublishTransaction'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createHistoricalEnvelopePublishTransaction
      x-ds-method: createHistoricalEnvelopePublishTransaction
      x-ds-service: Uncategorized
      description: 'This endpoint submits a batch of existing envelopes to a webhook of your choice. Set the webhook address with the `urlToPublishTo` request body parameter.


        This endpoint does not call an existing Connect configuration or create a new Connect listener to monitor new activity. It simply uses an ad hoc configuration to submit existing envelopes. You must include all the configuration data in the request body.


        The envelope data will always be transmitted in JSON format. XML, Salesforce, and eOriginal configuration types are not supported.


        Your request should match the following format:


        ```

        {

        "envelopes": ["4280f274-xxxx-xxxx-xxxx-b218b7eeda08", "8373a938-xxxx-xxxx-xxxx-e992a2abae01"],

        "config": {

        "configurationType":"custom",

        "name": "Test",

        "urlToPublishTo":"YOUR-WEBHOOK-URL",

        "allowEnvelopePublish": "true",

        "enableLog": "true",

        "requiresAcknowledgement": "true",

        "IncludeHMAC": "true",

        "SignMessageWithX509Cert": "true",

        "deliveryMode": "SIM",

        "eventData": {

        "version": "restv2.1",

        "format": "json",

        "includedata": ["tabs","payment_tabs","custom_fields","powerform","recipients","folders","extensions","attachments", "prefill_tabs", "documents"]

        }

        }

        }

        ```


        If the request succeeds, it returns a 201 (Created) HTTP response code and the response body property `processingStatus` will be set to `processing`. You can then view the status of each historical republish request in the Bulk Actions Log.'
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/connectHistoricalEnvelopeRepublish'
          application/xml:
            schema:
              $ref: '#/components/schemas/connectHistoricalEnvelopeRepublish'
components:
  schemas:
    envelopePublishTransaction:
      type: object
      properties:
        applyConnectSettings:
          description: ''
          type: string
        envelopeCount:
          description: ''
          type: string
        envelopeLevelErrorRollups:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/envelopePublishTransactionErrorRollup'
        envelopePublishTransactionId:
          description: The ID of the publish transaction.
          type: string
        errorCount:
          description: ''
          type: string
        fileLevelErrors:
          description: ''
          type: array
          items:
            type: string
        noActionRequiredEnvelopeCount:
          description: ''
          type: string
        processedEnvelopeCount:
          description: ''
          type: string
        processingStatus:
          description: 'The status of the transaction. Valid values:


            * `unprocessed`

            * `processing`

            * `complete`

            * `fatal_error`

            '
          type: string
        resultsUri:
          description: ''
          type: string
        submissionDate:
          description: ''
          type: string
        submittedByUserInfo:
          $ref: '#/components/schemas/userInfo'
          description: ''
        submittedForPublishingEnvelopeCount:
          description: ''
          type: string
      x-ds-definition-name: envelopePublishTransaction
      description: ''
      x-ms-summary: ''
    connectOAuthConfig:
      type: object
      properties:
        authorizationServerUrl:
          description: 'The token URL for your authorization server or OAuth service.


            This property is required.'
          type: string
        clientId:
          description: 'The client ID assigned to your app by your authorization server or OAuth service.


            This property is required.'
          type: string
        clientSecret:
          description: 'The secret value provided by your authorization server.


            This property is required.'
          type: string
        customParameters:
          description: ''
          type: object
          additionalProperties:
            type: string
        scope:
          description: 'The scopes that your app will request from the authorization server.


            This property is optional.


            **Note:** If you are using Azure, this value is the application ID URI of the secified resource affixed with the `.default`. For example: `api://{{clientId}}/.default`'
          type: string
      x-ds-definition-name: connectOAuthConfig
      description: A complex object describing a Connect OAuth configuration.
      x-ms-summary: A complex object describing a Connect OAuth configuration.
    connectSalesforceField:
      type: object
      properties:
        dsAttribute:
          description: ''
          type: string
        dsLink:
          description: A URL that links to the information in the Docusign field.
          type: string
        dsNode:
          description: ''
          type: string
        id:
          description: A unique ID for the Salesforce object.
          type: string
        sfField:
          description: ''
          type: string
        sfFieldName:
          description: The name of the Salesforce field.
          type: string
        sfFolder:
          description: The name of the Salesforce folder.
          type: string
        sfLockedValue:
          description: ''
          type: string
      description: This object is used to match a Docusign field to a Salesforce field so that Docusign can send information to your Salesforce account.
      x-ds-definition-name: connectSalesforceField
      x-ms-summary: This object is used to match a Docusign field to a Salesforce field so that Docusign can send information to your Salesforce account.
    connectSalesforceObject:
      type: object
      properties:
        active:
          description: When **true,** the `connectSalesforceObject` is active.
          type: string
        description:
          description: A description of the `connectSalesforceObject`.
          type: string
        id:
          description: The ID of the `connectSalesforceObject`.
          type: string
        insert:
          description: ''
          type: string
        onCompleteOnly:
          description: When **true,** Salesforce is updated only when the envelope is complete.
          type: string
        selectFields:
          description: The Docusign and Salesforce fields that you want to use to match a Salesforce object with Docusign information. This information tells Connect when to send updates to Salesforce.
          type: array
          items:
            $ref: '#/components/schemas/connectSalesforceField'
        sfObject:
          description: The Salesforce.com object type, such as `case`, `contact`, or `opportunity`.
          type: string
        sfObjectName:
          description: 'A name for the Salesforce object.


            **Note:** You can enter any name for the object. It does not have to match the `sfObject` property.'
          type: string
        updateFields:
          description: "The Docusign and Salesforce fields that you want to update. \n\n**Note:** You can choose to update SalesForce (with information from Docusign) only, update Docusign only, or both."
          type: array
          items:
            $ref: '#/components/schemas/connectSalesforceField'
      description: "A `connectSalesforceObject` is an object that updates envelope and document status or recipient status in your Salesforce account.\n\nWhen you install Docusign Connect for Salesforce, the service automatically sets up two Connect objects: one that updates envelope status and documents and one that updates recipient status. You can also customize Docusign Connect for Salesforce by associating Docusign objects with Salesforce objects so that Docusign Connect for Salesforce updates or inserts the information into the Salesforce object. For more information, see \n[Docusign for Salesforce - Adding Completed Documents to the Notes and Attachments](https://support.docusign.com/s/articles/DocuSign-for-Salesforce-Adding-Completed-Documents-to-the-Notes-and-Attachments-New)."
      x-ds-definition-name: connectSalesforceObject
      x-ms-summary: "A `connectSalesforceObject` is an object that updates envelope and document status or recipient status in your Salesforce account.\n\nWhen you install Docusign Connect for Salesforce, the service automatically sets up two Connect objects: one that updates envelope status and documents and one that updates recipient status. You can also customize Docusign Connect for Salesforce by associating Docusign objects with Salesforce objects so that Docusign Connect for Salesforce updates or inserts the information into the Salesforce object. For more information, see \n[Docusign for Salesforce - Adding Completed Documents to the Notes and Attachments](https://support.docusign.com/s/articles/DocuSign-for-Salesforce-Adding-Completed-Documents-to-the-Notes-and-Attachments-New)."
    envelopePublishTransactionErrorRollup:
      type: object
      properties:
        count:
          description: The maximum number of results to return.
          type: string
        errorType:
          description: ''
          type: string
      x-ds-definition-name: envelopePublishTransactionErrorRollup
      description: ''
      x-ms-summary: ''
    connectHistoricalEnvelopeRepublish:
      type: object
      properties:
        config:
          $ref: '#/components/schemas/connectCustomConfiguration'
          description: 'An object describing the ad hoc Connect configuration data. This object is required.


            **Note:** Regardless of the `eventData.version` parameter on this object, envelope data will always be transmitted in JSON format. XML is not supported.'
        envelopes:
          description: 'An array of envelope IDs as comma-separated strings. This property is required.


            For example: `["4280f274-xxxx-xxxx-xxxx-b218b7eeda08","9586h293-xxxx-xxxx-xxxx-m923b8opre71","2347w948-xxxx-xxxx-xxxx-t096b8krno89"]`'
          type: array
          items:
            type: string
      x-ds-definition-name: connectHistoricalEnvelopeRepublish
      description: The request body for the `createHistoricalEnvelopePublishTransaction` endpoint.
      x-ms-summary: The request body for the `createHistoricalEnvelopePublishTransaction` endpoint.
    errorDetails:
      description: This object describes errors that occur. It is only valid for responses and ignored in requests.
      type: object
      properties:
        errorCode:
          description: The code associated with the error condition.
          type: string
        message:
          description: A brief message describing the error condition.
          type: string
      x-ds-definition-name: errorDetails
      x-ms-summary: This object describes errors that occur. It is only valid for responses and ignored in requests.
    userInfo:
      type: object
      properties:
        accountId:
          description: The account ID associated with the envelope.
          type: string
        accountName:
          description: The name on the account.
          type: string
        activationAccessCode:
          description: Access code provided to the user to activate the account.
          type: string
        email:
          description: The user's email address.
          type: string
        errorDetails:
          $ref: '#/components/schemas/errorDetails'
          description: This object describes errors that occur. It is only valid for responses and ignored in requests.
        ipAddress:
          description: ''
          type: string
        loginStatus:
          description: When **true,** indicates that the user is logged in. This is a read-only property.
          type: string
        membershipId:
          description: The user's membership ID.
          type: string
        sendActivationEmail:
          description: This field is no longer supported for most accounts. To create an eSignature user without sending an activation email, use the Admin API by following [these steps](/docs/admin-api/how-to/create-active-user/).
          type: string
        uri:
          description: A URI containing the user ID.
          type: string
        userId:
          description: The ID of the user to access.
          type: string
        userName:
          description: The name of the user.
          type: string
        userStatus:
          description: 'Status of the user''s account. One of:


            - `ActivationRequired`

            - `ActivationSent`

            - `Active`

            - `Closed`

            - `Disabled`

            '
          type: string
        userType:
          description: The type of user, for example `CompanyUser`.
          type: string
      x-ds-definition-name: userInfo
      description: ''
      x-ms-summary: ''
    connectEventData:
      type: object
      properties:
        format:
          description: Reserved for Docusign.
          type: string
        includeData:
          description: 'A string array of the data to be included.

            The default is the empty array `[]`.


            - `attachments`: Include attachments associated with the envelope.

            - `custom_fields`: Include the custom fields associated with the envelope.

            - `documents`: Include the documents associated with the envelope.

            - `extensions`: Include information about the email settings associated with the envelope.

            - `folders`: Include the folder where the envelope exists.

            - `payment_tabs`: Include the payment tabs associated with the envelope.

            - `powerform`: Include the PowerForms associated with the envelope.

            - `prefill_tabs`: Include the [pre-filled tabs](/docs/esign-rest-api/esign101/concepts/tabs/prefilled-tabs/) associated with the envelope.

            - `recipients`: Include the recipients associated with the envelope.

            - `tabs`: Include the tabs associated with the envelope.

            '
          type: array
          items:
            type: string
        version:
          description: Set this property to `restv2.1` to return event data in JSON. If the property is not set, the event data will be returned in XML by default.
          type: string
      description: This object lets you choose the data format of your Connect response.
      x-ds-definition-name: connectEventData
      x-ms-summary: This object lets you choose the data format of your Connect response.
    connectCustomConfiguration:
      type: object
      properties:
        allowEnvelopePublish:
          description: Set this value to **true** to enable the webhook. The default property is **false.**
          type: string
        allowSalesforcePublish:
          description: 'When **true,** Docusign sends data to the designated Salesforce account through Connect. The default value is **true.**


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        allUsers:
          description: 'When **true,** the tracked envelope and recipient events for all users, including users that are added a later time, are sent through Connect. The default value is **false.**


            **Note:** If this property is **false,** make sure you set the `userIds` property to a non-empty array of user IDs.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        allUsersExcept:
          description: 'This flag enables you to toggle between including and excluding specified users from the configuration. When **false,** the users corresponding to the IDs in `userIds` will be included in the configuration. Conversely, when **true,** the users will be excluded from the configuration. The default value is **false.**


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        configurationType:
          description: 'The type of the configuration. Valid values:


            * `custom`: Creates an account-level configuration

            * `customrecipient`: Creates a Recipient Connect configuration

            * `salesforce`

            * `eOriginal`


            This property is required.'
          type: string
        connectId:
          description: 'The Docusign-generated ID for the Connect configuration.


            This property is read-only.'
          type: string
        deliveryMode:
          description: 'The delivery mode of the configuration. Valid values:


            * `SIM`

            * `Aggregate`


            This property is required.'
          type: string
        disabledBy:
          description: ''
          type: string
        enableLog:
          description: "When **true,** Connect logging is turned on. Docusign recommends that you enable this functionality to help troubleshoot any issues. \n\nYou can have a maximum of 100 active logs in your account. You can view the entries in active logs in the **Logs** tab in the Connect console.\n\nThis property is required."
          type: string
        enableOAuthPerConfiguration:
          description: ''
          type: string
        envelopeEvents:
          description: 'A list of envelope-level event statuses that will trigger Connect to send updates to the endpoint specified in the `url` property.


            When using any of

            [the legacy event message formats](/platform/webhooks/connect/legacy-message-formats/),

            you must include either the `envelopeEvents` property

            or the `recipientEvents` property.

            If you are instead using the

            [JSON SIM event model](/platform/webhooks/connect/json-sim-event-model/),

            use the [`events`](/docs/esign-rest-api/reference/connect/connectconfigurations/create/#schema__connectcustomconfiguration_events) property.


            The [possible event statuses](/platform/webhooks/connect/event-triggers/) are:


            * `Sent`

            * `Delivered`

            * `Completed`

            * `Declined`

            * `Voided`


            **Note:** These values are case-sensitive.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: array
          items:
            type: string
        eventData:
          $ref: '#/components/schemas/connectEventData'
          description: 'Allows you to specify the format of the information the Connect webhooks returns.


            This property is required.'
        events:
          description: 'A comma-separated list of envelope-level event statuses that will trigger Connect to send updates to the endpoint specified in the `urlToPublishTo` property.


            Set this property when you are using the [JSON SIM event model](/platform/webhooks/connect/json-sim-event-model/). If you are instead using any of [the legacy event message formats](/platform/webhooks/connect/legacy-message-formats/), set either the `envelopeEvents` property or the `recipientEvents` property.


            The [possible event statuses](/platform/webhooks/connect/json-sim-event-reference/) are:


            * `envelope-created`

            * `envelope-sent`

            * `envelope-resent`

            * `envelope-delivered`

            * `envelope-completed`

            * `envelope-declined`

            * `envelope-voided`

            * `recipient-authenticationfailed`

            * `recipient-autoresponded`

            * `recipient-declined`

            * `recipient-delivered`

            * `recipient-completed`

            * `recipient-sent`

            * `recipient-resent`

            * `template-created`

            * `template-modified`

            * `template-deleted`

            * `envelope-corrected`

            * `envelope-purge`

            * `envelope-deleted`

            * `envelope-discard`

            * `recipient-reassign`

            * `recipient-delegate`

            * `recipient-finish-later`

            * `click-agreed`

            * `click-declined`


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: array
          items:
            type: string
        externalFolderId:
          description: 'The ID of an external folder.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        externalFolderLabel:
          description: 'The label for an external folder.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        groupIds:
          description: ''
          type: array
          items:
            type: string
        includeCertificateOfCompletion:
          description: 'When **true,** the Connect Service includes the Certificate of Completion with completed envelopes.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        includeCertSoapHeader:
          description: ''
          type: string
        includeDocumentFields:
          description: 'When **true,** the document fields associated with the envelope''s documents are included in the notification messages. Document fields are optional custom name-value pairs added to documents using the API.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        includeDocuments:
          description: Reserved for Docusign.
          type: string
        includeEnvelopeVoidReason:
          description: 'When **true,** if the envelope is voided, the Connect Service notification will include the void reason, as entered by the person that voided the envelope.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        includeHMAC:
          description: 'When **true,** Connect will use HMAC to verify the request.


            This property is required. '
          type: string
        includeOAuth:
          description: ''
          type: string
        includeSenderAccountasCustomField:
          description: 'When **true,** Connect will include the sender account as custom field in the data.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        includeTimeZoneInformation:
          description: 'When **true,** Connect will include the envelope time zone information.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        integratorManaged:
          description: ''
          type: string
        name:
          description: 'The name of the Connect configuration.


            This property is required.'
          type: string
        oAuthConfiguration:
          $ref: '#/components/schemas/connectOAuthConfig'
          description: ''
        password:
          description: 'The password for the Connect configuration.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.

            '
          type: string
        pausePublish:
          description: ''
          type: string
        recipientEvents:
          description: 'An array of recipient event statuses that will trigger Connect to send notifications to your webhook listener at the URL endpoint specified in the `url` property.


            When using any of [the legacy event message formats](/platform/webhooks/connect/legacy-message-formats/), you must include either the `envelopeEvents` property or the `recipientEvents` property. If you are instead using the [JSON SIM event model](/platform/webhooks/connect/json-sim-event-model/), use the `events` property.


            The [possible event statuses](/platform/webhooks/connect/event-triggers/) are:


            * `Sent`

            * `AutoResponded`

            * `Delivered`

            * `Completed`

            * `Declined`

            * `AuthenticationFailed`


            **Note:** These values are case-sensitive.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: array
          items:
            type: string
        requireMutualTls:
          description: 'When **true,** [Mutual TLS](/platform/webhooks/mutual-tls/) authentication is enabled.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        requiresAcknowledgement:
          description: 'When **true,** event delivery acknowledgements are enabled for your Connect configuration.


            Docusign Connect awaits a valid 200 response from your application acknowledging that it received a message. If you do not acknowledge receiving an event notification message within 100 seconds, Docusign treats the message as a failure and places it into a failure queue. It is imperative that you acknowledge successful receipt of Connect events as they occur by sending a 200 event back.


            #### When **true** and Send Individual Messages (SIM) mode is activated


            If the HTTP status response to a notification message is not in the range of 200-299,

            then the message delivery failed, and the configuration is marked as down.


            The message will be queued and retried once per day.

            While a Connect configuration is marked down, subsequent notifications will not be tried. Instead, they will be immediately queued with the reason `Pending`.

            When a message succeeds, all queued messages for the configuration will be tried immediately, in order.


            There is a maximum of ten retries. Alternately, you can use **Republish Connect Information** to manually republish the notification.


            #### When **true** and SIM mode is not activated


            If the HTTP Status response to a notification message is not in the range of 200-299,  then the message delivery failed, and the message is queued.


            The message will be retried after at least a day the next time a subsequent message is successfully sent to this configuration (subscription).  Subsequent notifications will be tried when they occur.

            There is a maximum of ten retries. Alternately, you can use **Republish Connect Information** to manually republish the notification.


            #### When **false**


            When `requiresAcknowledgement` is set to **false** and you do not acknowledge receiving an event notification message within 100 seconds, Docusign treats the message as a failure and determines that the server is unavailable. It does not retry to send the notification message, and you must handle the failure manually.


            This property is required.'
          type: string
        salesforceApiVersion:
          description: 'The version of the Salesforce API that you are using.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        salesforceAuthcode:
          description: ''
          type: string
        salesforceCallBackUrl:
          description: ''
          type: string
        salesforceDocumentsAsContentFiles:
          description: 'When **true,** Docusign can use documents in your Salesforce account for sending and signing.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        senderOverride:
          description: ''
          type: string
        senderSelectableItems:
          description: 'This property sets the items that are available for selection when adding or editing Connect objects.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: array
          items:
            type: string
        sfObjects:
          description: 'An array of Salesforce objects.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: array
          items:
            $ref: '#/components/schemas/connectSalesforceObject'
        signMessageWithX509Certificate:
          description: 'When **true,** Mutual TLS will be enabled for notifications. Mutual TLS must be initiated by the listener (the customer''s web server) during the TLS handshake protocol.


            This property is required.'
          type: string
        soapNamespace:
          description: 'The namespace of the SOAP interface.


            **Note:** If `useSoapInterface` is set to **true,** you must set this value.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        urlToPublishTo:
          description: 'The web address of the listener or retrieving service endpoint. It must be an HTTPS URL.


            This property is required.'
          type: string
        userIds:
          description: 'A comma-separated list of user IDs. This sets the users associated with the tracked envelope and recipient events. When a tracked event occurs for a set user, the a notification message is sent to your Connect listener.


            By default, the users will be included in the configuration. If you want to exclude the users, set the `allUsersExcept` property to **true.**


            **Note:** If `allUsers` is set to `false`, then you must provide a list of user IDs.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: array
          items:
            type: string
        userName:
          description: 'The name of the user.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
        useSoapInterface:
          description: 'When **true,** the notifications are sent to your endpoint as SOAP requests.


            This property is not used for the `createHistoricalEnvelopePublishTransaction` endpoint.'
          type: string
      description: The `connectCustomConfiguration` object describes a Connect configuration for your account.
      x-ds-definition-name: connectCustomConfiguration
      x-ms-summary: The `connectCustomConfiguration` object describes a Connect configuration for your account.
