openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Authorizations API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: Authorizations
  description: A user authorization is created to share access between users on the same account. One user can be given access to sign, manage, or send on behalf of another. These endpoints allow you to create, delete, and manage user authorizations.
paths:
  /v2.1/accounts/{accountId}/users/{userId}/authorization:
    parameters: []
    post:
      tags:
      - Authorizations
      summary: Creates a user authorization
      operationId: UserAuthorization_CreateUserAuthorization
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorization'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createUserAuthorization
      x-ds-method: createUserAuthorization
      x-ds-service: Uncategorized
      description: 'Creates an authorization allowing one user to send and/or manage envelopes on behalf of another user.


        The _agent_ user acts on behalf of the _principal_ user. The principal user is specified by the `userId` path parameter. The agent user is specified in the request body. Each principal user can only share signing permission with one agent user.


        Specify in the request the level of access to share with the agent user. If you share signing access, the agent user will receive an email notification.


        To call this endpoint:

        * You must be an account administrator or you must be the principal user.

        * The agent user and principal user must belong to the same account.

        * At least one of the following account settings must be enabled: `AllowDelegatedSigning`, `AllowManagingEnvelopesOnBehalfOfOthers`, `AllowEditingEnvelopesOnBehalfOfOthers`, `AllowSendingEnvelopesOnBehalfOfOthers`. These settings correspond to the level of access you can set for the authorization.'
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userAuthorizationCreateRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/userAuthorizationCreateRequest'
  /v2.1/accounts/{accountId}/users/{userId}/authorization/{authorizationId}:
    parameters: []
    get:
      tags:
      - Authorizations
      summary: Returns the user authorization for a given authorization ID
      operationId: UserAuthorization_GetUserAuthorization
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: authorizationId
        in: path
        required: true
        description: The ID of the user authorization.
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorization'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getUserAuthorization
      x-ds-method: getUserAuthorization
      x-ds-service: Uncategorized
      description: 'Returns the details for the user authorization specified by the `authorizationId`.


        To call this endpoint, you must be an account administrator or you must be the principal user for the specified authorization.'
      x-ds-in-sdk: true
    put:
      tags:
      - Authorizations
      summary: Updates the start or end date for a user authorization
      operationId: UserAuthorization_UpdateUserAuthorization
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: authorizationId
        in: path
        required: true
        description: The ID of the user authorization.
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorization'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateUserAuthorization
      x-ds-method: updateUserAuthorization
      x-ds-service: Uncategorized
      description: 'Updates the start and/or end date for a given user authorization. Specify the user authorization and principal user with the path parameters.


        To call this endpoint, you must be an account administrator or you must be the principal user for the specified authorization.'
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userAuthorizationUpdateRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/userAuthorizationUpdateRequest'
    delete:
      tags:
      - Authorizations
      summary: Deletes the user authorization
      operationId: UserAuthorization_DeleteUserAuthorization
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: authorizationId
        in: path
        required: true
        description: The ID of the user authorization.
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteUserAuthorization
      x-ds-method: deleteUserAuthorization
      x-ds-service: Uncategorized
      description: 'Deletes the user authorization specified by the `authorizationId`.


        To call this endpoint, you must be an account administrator or you must be the principal user for the specified authorization.'
      x-ds-in-sdk: true
  /v2.1/accounts/{accountId}/users/{userId}/authorizations:
    parameters: []
    get:
      tags:
      - Authorizations
      summary: Returns the authorizations for which the specified user is the principal user
      operationId: UserAuthorizations_GetPrincipalUserAuthorizations
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      - name: active_only
        in: query
        required: false
        description: When **true,** return only active authorizations. The default value is **true.**
        schema:
          type: string
      - name: count
        in: query
        required: false
        description: The maximum number of results to return.
        schema:
          type: string
      - name: email_substring
        in: query
        required: false
        description: Filters returned user records by full email address or a substring of email address.
        schema:
          type: string
      - name: include_closed_users
        in: query
        required: false
        description: When **true,** returns active and scheduled authorizations of closed users. The default value is **true.** This value is only applied when `active_only` is **false.**
        schema:
          type: string
      - name: permissions
        in: query
        required: false
        description: 'Filters results by authorization permission. Valid values:

          * `Send`

          * `Manage`

          * `Sign`'
        schema:
          type: string
      - name: start_position
        in: query
        required: false
        description: The position within the total result set from which to start returning values. The value **thumbnail** may be used to return the page image.
        schema:
          type: string
      - name: task_source
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: task_type
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: user_name_substring
        in: query
        required: false
        description: 'Filters results based on a full or partial user name.


          **Note:** When you enter a partial user name, you do not use a wildcard character.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorizations'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getPrincipalUserAuthorizations
      x-ds-method: getPrincipalUserAuthorizations
      x-ds-service: Uncategorized
      description: 'Returns the user authorizations for which the user specified by `userId` is the principal user.


        To call this endpoint, you must be an account administrator or you must be the specified principal user.'
      x-ds-in-sdk: true
    post:
      tags:
      - Authorizations
      summary: Create or update multiple user authorizations
      operationId: UserAuthorizations_PostUserAuthorizations
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorizationsResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createUserAuthorizations
      x-ds-method: createUserAuthorizations
      x-ds-service: Uncategorized
      description: 'Create or update multiple user authorizations in a single request. The body of the request is a list of userAuthorizationSomething objects. To create a new authorization, specify the `agentUser` and `permission` fields, with the optional `startDate` and `endDate` fields. To update an existing authorization, specify the `authorizationId` field and the `startDate` and/or `endDate` fields.


        For example, to create a new authorization and update the end date of an existing authorization, your request body might look like this:


        ```

        {

        "authorizations": [

        {

        "agentUser": {

        "userId": "1470ff66-xxxx-xxxx-xxxx-8c46f140da37",

        "accountId": "230546a7-xxxx-xxxx-xxxx-af205d5494ad"

        },

        "permission": "manage"

        },

        {

        "authorizationId": "b73ac983-xxxx-xxxx-xxxx-b3c0ea5b09d3",

        "endDate": "2023-05-09T21:36:27.0000000+00:00"

        }

        ]

        }

        ```


        The principal user is specified by the `userId` path parameter. To call this endpoint, you must be an account administrator or the principal user.


        **Note:** To create an authorization with signing permission, the `AllowDelegationSigning` setting must be enabled on the account. If you share signing access, the agent user will receive an email notification. Each principal user can only share signing permission with one agent user.'
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userAuthorizationsRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/userAuthorizationsRequest'
    delete:
      tags:
      - Authorizations
      summary: Delete multiple user authorizations
      operationId: UserAuthorizations_DeleteUserAuthorizations
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The ID of the principal user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorizationsDeleteResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteUserAuthorizations
      x-ds-method: deleteUserAuthorizations
      x-ds-service: Uncategorized
      description: 'Delete one or more user authorizations for a given principal user. The principal user is specified by the `userId` path parameter.


        To call this endpoint, you must be an account administrator or you must be the principal user for the specified authorizations.'
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/userAuthorizationsDeleteRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/userAuthorizationsDeleteRequest'
  /v2.1/accounts/{accountId}/users/{userId}/authorizations/agent:
    parameters: []
    get:
      tags:
      - Authorizations
      summary: Returns the authorizations for which the specified user is the agent user
      operationId: UserAgentAuthorizations_GetAgentUserAuthorizations
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: userId
        in: path
        description: The user who is acting as the agent.
        required: true
        schema:
          type: string
      - name: active_only
        in: query
        required: false
        description: When **true,** only active users are returned. The default value is **false.**
        schema:
          type: string
      - name: count
        in: query
        required: false
        description: The maximum number of results to return.
        schema:
          type: string
      - name: email_substring
        in: query
        required: false
        description: Filters returned user records by full email address or a substring of email address.
        schema:
          type: string
      - name: include_closed_users
        in: query
        required: false
        description: When **true,** returns active and scheduled authorizations of closed users. The default value is **true.** This value is only applied when `active_only` is **false.**
        schema:
          type: string
      - name: permissions
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: start_position
        in: query
        required: false
        description: The position within the total result set from which to start returning values. The value **thumbnail** may be used to return the page image.
        schema:
          type: string
      - name: task_source
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: task_type
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: user_name_substring
        in: query
        required: false
        description: 'Filters results based on a full or partial user name.


          **Note:** When you enter a partial user name, you do not use a wildcard character.'
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/userAuthorizations'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getAgentUserAuthorizations
      x-ds-method: getAgentUserAuthorizations
      x-ds-service: Uncategorized
      description: 'Returns the user authorizations for which the user specified by `userId` is the agent user.


        If the calling user is an account administrator, the full results will be returned. Otherwise, only authorizations for which the calling user is the principal user will be returned.'
      x-ds-in-sdk: true
components:
  schemas:
    userAuthorizationCreateRequestWithId:
      type: object
      properties:
        agentUser:
          $ref: '#/components/schemas/authorizationUser'
          description: The agent user. This property is required if you are creating a new authorization.
        authorizationId:
          description: The ID of the user authorization. This property is required to update an existing authorization.
          type: string
        endDate:
          description: 'The UTC DateTime to end the authorization. The default value is the max UTC value: `9999-12-31T23:59:59.0000000+00:00`.'
          type: string
        permission:
          description: 'The [permission level](/docs/esign-rest-api/esign101/concepts/envelopes/shared-access/) to grant the agent. Valid values:

            * `Send`

            * `Manage`

            * `Sign`

            * `Edit`


            This property is required.

            '
          type: string
        startDate:
          description: The UTC DateTime to initiate the authorization. The default value is the current date and time.
          type: string
        taskSource:
          description: ''
          type: string
        taskType:
          description: ''
          type: string
      x-ds-definition-name: userAuthorizationCreateRequestWithId
      description: A user authorizations to create or update.
      x-ms-summary: A user authorizations to create or update.
    userAuthorizationWithStatus:
      type: object
      properties:
        authorization:
          $ref: '#/components/schemas/userAuthorization'
          description: ''
        errorMessage:
          description: ''
          type: string
        success:
          description: ''
          type: string
      x-ds-definition-name: userAuthorizationWithStatus
      description: ''
      x-ms-summary: ''
    userAuthorizationUpdateRequest:
      type: object
      properties:
        endDate:
          description: 'The end date for the user authorization. The default value is the max UTC value: `9999-12-31T23:59:59.0000000+00:00`.'
          type: string
        startDate:
          description: The start date for the user authorization. The default value is the current date and time.
          type: string
      x-ds-definition-name: userAuthorizationUpdateRequest
      description: The request object to update a user authorization.
      x-ms-summary: The request object to update a user authorization.
    userAuthorizationsDeleteRequest:
      type: object
      properties:
        authorizations:
