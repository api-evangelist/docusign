    userAuthorizationCreateRequest:
      type: object
      properties:
        agentUser:
          $ref: '#/components/schemas/authorizationUser'
          description: The user who will be able to act on behalf of the principal user.
        endDate:
          description: The UTC DateTime to end the authorization. The default value is the max UTC value (`9999-12-31T23:59:59.0000000+00:00`).
          type: string
        permission:
          description: 'The [permission level](/docs/esign-rest-api/esign101/concepts/envelopes/shared-access/) to grant the agent. Valid values:

            * `Send`

            * `Manage`

            * `Sign`

            * `Edit`


            This property is required.

