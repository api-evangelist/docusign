openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Identity Verifications API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: Identity Verifications
  description: 'The Docusign Identity Verification process requires a signer to submit an image of their valid government ID and wait for the image to be uploaded and verified before they can access a document.


    Identity Verification supports government photo IDs and European eIDs, analyzing the document security features and matching the name on the agreement against the name on the ID. After a successful verification, the signer can view the agreement and sign as usual.


    To use Identity Verification, the Docusign Identity Verification product must be enabled for your account.


    For more information, see Digital ID Verification of Government-Issued IDs.'
paths:
  /v2.1/accounts/{accountId}/identity_verification:
    parameters: []
    get:
      tags:
      - Identity Verifications
      summary: Retrieves the Identity Verification workflows available to an account
      operationId: AccountIdentityVerification_GetAccountIdentityVerification
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: identity_verification_workflow_status
        in: query
        required: false
        description: 'Filters the workflows returned according to status. Valid values:


          - `active`: Only active workflows are returned. This is the default.

          - `deactivated`: Only deactivated workflows are returned.

          - `all`: All workflows are returned.

          '
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountIdentityVerificationResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getAccountIdentityVerification
      description: 'This method returns a list of Identity Verification workflows that are available to an account.


        **Note:** To use this method, you must either be an account administrator or a sender.


        ### Related topics


        - How to require ID Verification (IDV) for a recipient'
      x-ds-method: list
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
