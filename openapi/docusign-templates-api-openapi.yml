            properties:
              fieldId:
                type: string
              name:
                type: string
              value:
                type: string
              required:
                type: string
              show:
                type: string
          example: []
        listCustomFields:
          type: array
          items:
            type: object
            properties:
              fieldId:
                type: string
              name:
