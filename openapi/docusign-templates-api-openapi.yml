components:
  schemas:
    Document:
      type: object
      description: A document to be included in an envelope. Documents can be provided as base64-encoded content or by reference.
      properties:
        documentId:
          type: string
          description: A unique identifier for the document within the envelope, assigned by the sender. Must be unique within the envelope.
          example: '500123'
        name:
          type: string
          description: The name of the document.
          example: Example Title
        fileExtension:
          type: string
          description: The file extension of the document. DocuSign uses this to determine the correct content type.
          example: example_value
        documentBase64:
          type: string
          description: The base64-encoded content of the document.
          example: example_value
        remoteUrl:
          type: string
          description: URL from which to retrieve the document content.
          example: https://www.example.com
        order:
          type: string
          description: The order of the document in the envelope.
          example: example_value
        pages:
          type: string
          description: The number of pages in the document.
          example: example_value
        display:
          type: string
          description: Display setting for the document.
          enum:
          - inline
          - modal
          - download
          example: inline
        includeInDownload:
          type: string
          description: Whether to include this document in downloads.
          example: example_value
        transformPdfFields:
          type: string
          description: When true, DocuSign transforms PDF form fields into DocuSign tabs.
          example: example_value
    EnvelopeTemplateResults:
      type: object
      description: Contains results of a template list request.
      properties:
        envelopeTemplates:
          type: array
          items:
            $ref: '#/components/schemas/EnvelopeTemplate'
          example: []
        resultSetSize:
          type: string
          example: example_value
        totalSetSize:
          type: string
          example: example_value
        startPosition:
          type: string
          example: example_value
        endPosition:
          type: string
          example: example_value
        nextUri:
          type: string
          example: example_value
        previousUri:
          type: string
          example: example_value
        folders:
          type: array
          items:
            type: object
            properties:
              folderId:
                type: string
              name:
                type: string
              itemCount:
                type: string
          example: []
    Intermediary:
      type: object
      description: An intermediary recipient who can forward the envelope to another person.
      properties:
        recipientId:
          type: string
          example: '500123'
        name:
          type: string
          example: Example Title
        email:
          type: string
          format: email
          example: user@example.com
        routingOrder:
          type: string
          example: example_value
        status:
          type: string
          example: example_value
    EmailTab:
      type: object
