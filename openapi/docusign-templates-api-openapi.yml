              type: array
              items:
                type: string
          example: example_value
        accessCode:
          type: string
          description: An access code the recipient must enter to access the envelope.
          example: example_value
        requireIdLookup:
          type: string
          description: Whether ID lookup authentication is required.
          example: example_value
