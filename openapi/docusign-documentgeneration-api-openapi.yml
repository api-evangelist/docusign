openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Document Generation API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: DocumentGeneration
  description: '[Document generation][webapp support page] enables you

    to create reusable templates

    with professionally formatted documents

    that include personalized data.

    For example, you can create

    a boilerplate employment offer letter

    that is updated with job details

    for each candidate from an HR system .


    To learn more about using these endpoints

    with the eSignature API,

    see [Document generation][concepts page]

    in the eSignature concepts guide.


    [webapp support page]: https://support.docusign.com/s/document-item?bundleId=als1679428547895&topicId=ldx1679428689631.html

    [concepts page]: /docs/esign-rest-api/esign101/concepts/documents/document-generation/'
paths:
  /v2.1/accounts/{accountId}/envelopes/{envelopeId}/docGenFormFields:
    parameters: []
    get:
      tags:
      - DocumentGeneration
      summary: Returns sender fields for an envelope
      operationId: DocGenFormFields_GetEnvelopeDocGenFormFields
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docGenFormFieldResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getEnvelopeDocGenFormFields
      x-ds-method: getEnvelopeDocGenFormFields
      x-ds-service: Uncategorized
      description: 'Given an `envelopeId`, this method returns the sender fields found in that envelope''s documents. After you retrieve the sender fields, use the DocumentGeneration::updateEnvelopeDocGenFormFields method to populate the fields.


        If the specified envelope does not contain a document with sender fields, the method will return success (`200`) and an empty object (`{}`) in the response.


        ### Next steps


        - Learn about document generation in the eSignature concepts guide.

        - Learn how to send an envelope with document generation in your preferred coding language.'
      x-ds-in-sdk: true
    put:
      tags:
      - DocumentGeneration
      summary: Updates sender fields for an envelope
      operationId: DocGenFormFields_PutEnvelopeDocGenFormFields
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      - name: update_docgen_formfields_only
        in: query
        required: false
        description: 'When **false** or omitted,

          the documents are updated.


          When **true,** only the form fields are updated. The documents are unchanged.


          '
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/docGenFormFieldResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateEnvelopeDocGenFormFields
      x-ds-method: updateEnvelopeDocGenFormFields
      x-ds-service: Uncategorized
      description: 'This method dynamically generates an envelope''s documents by populating its sender fields. The envelope must be in a draft state.


        Use the DocumentGeneration::getEnvelopeDocGenFormFields response to retrieve the list of sender fields for your envelope. Use that list to build the request for this method. For each field, specify the field name and the value to populate.


        For example, your request body might look like this:


        ```json

        {

        "docGenFormFields": [

        {

        "documentId": "bf3202e1-xxxx-xxxx-xxxx-af4f41366879",

        "docGenFormFieldList": [

        {

        "name": "Candidate_Name",

        "value": "Peggy Olson"

        },

        {

        "name": "Job_Title",

        "value": "Technical Writer"

        },

        {

        "name": "Manager_Name",

        "value": "Donald Draper"

        },

        {

        "name": "Start_Date",

        "value": "1960-02-28"

        },

        {

        "name": "Salary",

        "value": "3380"

        }

        ]

        }

        ]

        }

        ```


        ### Important notes


        * If `update_docgen_formfields_only` is false (the default), the `documentId` changes after the update.

        * This endpoint does not validate number, date, or select data field values. The request can succeed even if a number or date field value is not a valid number or date, or if a select field value is not one of the allowed values.


        ### Related topics


        - Learn about document generation in the eSignature concepts guide.

        - See this method in use in your preferred coding language.'
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/docGenFormFieldRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/docGenFormFieldRequest'
components:
  schemas:
    docGenFormFieldOption:
      type: object
      properties:
        description:
          description: Description of the selectable option.
          type: string
        label:
          description: The label for the selectable option.
          type: string
        selected:
          description: When **true,** the option is selected.
          type: string
        value:
          description: Specifies the value of the option. This is the value of the form field when this option is selected.
          type: string
      x-ds-definition-name: docGenFormFieldOption
      description: Specifies an individual option setting when type is `Select`.
      x-ms-summary: Specifies an individual option setting when type is `Select`.
    docGenFormFieldRowValue:
      type: object
      properties:
        docGenFormFieldList:
          description: 'The sender fields in each row of the table.


            For GET requests, the `label`, `type`, `required`, and `name` properties will be returned.


            For POST requests, supply the `name` and `value` for each child object. These correspond to the values in each column.'
          type: array
          items:
            $ref: '#/components/schemas/docGenFormField'
      x-ds-definition-name: docGenFormFieldRowValue
      description: An object representing a row of a dynamic table.
      x-ms-summary: An object representing a row of a dynamic table.
    docGenSyntaxError:
      type: object
      properties:
        errorCode:
          description: A code associated with the error condition.
          type: string
        message:
          description: The error message.
          type: string
        tagIdentifier:
          description: 'The tag that caused the syntax error.

            See [Document Generation Syntax](https://support.docusign.com/s/document-item?bundleId=als1679428547895&topicId=ftc1679700030026.html)

            to learn more about document generation syntax rules.'
          type: string
      x-ds-definition-name: docGenSyntaxError
      description: Describes document generation errors.
      x-ms-summary: Describes document generation errors.
    docGenFormFieldResponse:
      type: object
      properties:
        docGenFormFields:
          description: A list of `docGenFormFields` objects.
          type: array
          items:
            $ref: '#/components/schemas/docGenFormFields'
        errorDetails:
          $ref: '#/components/schemas/errorDetails'
          description: This object describes errors that occur. It is only valid for responses and ignored in requests.
      x-ds-definition-name: docGenFormFieldResponse
      description: An object for document generation responses.
      x-ms-summary: An object for document generation responses.
    docGenFormField:
      type: object
      properties:
        connectedObjectDetails:
          $ref: '#/components/schemas/connectedObjectDetails'
          description: ''
        defaultValue:
          description: ''
          type: string
        description:
          description: A description of the field. Displayed with the label.
          type: string
        filter:
          description: An object used to present a filtered view of the items in a folder.
          type: string
        format:
          $ref: '#/components/schemas/docGenFormat'
          description: ''
        fullyQualifiedPath:
          description: ''
          type: string
        hidden:
          description: ''
          type: string
        label:
          description: A label displayed near the field.
          type: string
        name:
          description: 'The name of the sender field.


            Required for PUT requests.

            '
          type: string
        options:
          description: When `type` is `Select`, this array describes the available options.
          type: array
          items:
            $ref: '#/components/schemas/docGenFormFieldOption'
        order:
          description: "The order in which to sort the results.\n\nValid values are: \n\n\n* `asc`: Ascending order.\n* `desc`: Descending order. "
          type: string
        predefinedValidation:
          description: Reserved for Docusign.
          type: string
        readOnly:
          description: ''
          type: string
        required:
          description: When **true,** the field is required.
          type: string
        rowValues:
          description: 'For fields of type `TableRow`, this property represents the sender fields in the row.


            For GET requests, this array contains a single `docGenFormFieldRowValue` object. That object contains a list of sender fields that will appear in each row.


            For PUT requests, you must supply a `docGenFormFieldRowValue` object for each row in the table. This populates the data in the table.

            '
          type: array
          items:
            $ref: '#/components/schemas/docGenFormFieldRowValue'
        type:
          description: 'The kind of data the sender field holds. Valid values:


            - `TextBox`

            - `Date`

            - `Number`

            - `Select`

            - `TableRow`

            '
          type: string
        validation:
          $ref: '#/components/schemas/docGenFormFieldValidation'
          description: Describes how values are validated.
        value:
          description: 'The value of the sender field.


            For PUT requests, you must supply either this property (for all fields except `TableRow` types) or `rowValues` (for `TableRow` fields).'
          type: string
      x-ds-definition-name: docGenFormField
      description: 'The document fields available for document generation.


        This object is used in reponses (GET) and requests (PUT). When used with [DocumentGeneration: updateEnvelopeDocGenFormFields](/docs/esign-rest-api/reference/envelopes/documentgeneration/updateenvelopedocgenformfields/) (PUT), the `name` and `value` / `rowValues` properties are required and any other values are ignored.

        '
      x-ms-summary: 'The document fields available for document generation.


        This object is used in reponses (GET) and requests (PUT). When used with [DocumentGeneration: updateEnvelopeDocGenFormFields](/docs/esign-rest-api/reference/envelopes/documentgeneration/updateenvelopedocgenformfields/) (PUT), the `name` and `value` / `rowValues` properties are required and any other values are ignored.

        '
    docGenFormFieldRequest:
      type: object
      properties:
        docGenFormFields:
          description: A list of `docGenFormFields` objects.
          type: array
          items:
            $ref: '#/components/schemas/docGenFormFields'
      x-ds-definition-name: docGenFormFieldRequest
