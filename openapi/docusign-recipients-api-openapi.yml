              value:
                type: string
              selected:
                type: string
              pageNumber:
                type: string
              xPosition:
                type: string
              yPosition:
                type: string
              anchorString:
                type: string
          example: []
        required:
          type: string
          example: example_value
    InPersonSigner:
      type: object
      description: An in-person signer recipient for face-to-face signing where a host manages the signing session.
      properties:
        recipientId:
          type: string
          example: '500123'
