info:
  version: v2.1
  title: Docusign eSignature REST Notary Journals API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: NotaryJournals
  description: ''
paths:
  /v2.1/current_user/notary/journals:
    parameters: []
    get:
      tags:
      - NotaryJournals
      summary: Gets notary jurisdictions for a user
      operationId: NotaryJournals_GetNotaryJournals
      parameters:
      - name: count
        in: query
        required: false
        description: The maximum number of results to return.
        schema:
          type: string
      - name: search_text
        in: query
        required: false
        description: Use this parameter to search for specific text.
        schema:
          type: string
      - name: start_position
        in: query
        required: false
        description: The position within the total result set from which to start returning values. The value **thumbnail** may be used to return the page image.
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/notaryJournalList'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: listNotaryJournals
      description: ''
      x-ds-method: list
      x-ds-service: Notary
      x-ds-in-sdk: true
components:
  schemas:
    notaryJournalMetaData:
      type: object
      properties:
        comment:
          description: A freeform comment that the notary can add to the journal entry.
          type: string
        credibleWitnesses:
          description: An array of witnesses.
          type: array
          items:
            $ref: '#/components/schemas/notaryJournalCredibleWitness'
        signatureImage:
          description: A base64-encoded image of the signature.
          type: string
        signerIdType:
          description: A string that describes the ID that the signer presented. For example `drivers license` or `military ID`.
          type: string
      x-ds-definition-name: notaryJournalMetaData
      description: ''
      x-ms-summary: ''
    notaryJournal:
      type: object
      properties:
        createdDate:
          description: The creation date of the account in UTC timedate format.
          type: string
        documentName:
          description: The name of the document.
          type: string
        jurisdiction:
          $ref: '#/components/schemas/jurisdiction'
          description: 'The notary''s jurisdiction.

            '
        notaryJournalId:
          description: A unique GUID for this journal entry.
          type: string
        notaryJournalMetaData:
          $ref: '#/components/schemas/notaryJournalMetaData'
          description: Additional journal data such as the witness list and signature image.
        signerName:
          description: 'The in-person signer''s full legal name.


            Required when `inPersonSigningType` is `inPersonSigner`.

            For eNotary flow, use `name` instead.


            Maximum Length: 100 characters.

            '
          type: string
      x-ds-definition-name: notaryJournal
      description: ''
      x-ms-summary: ''
    notaryJournalCredibleWitness:
      type: object
      properties:
        address:
          description: The address of the witness.
          type: string
        name:
          description: The name of the witness.
          type: string
        signatureImage:
          description: A base64-encoded image of the signature.
          type: string
      x-ds-definition-name: notaryJournalCredibleWitness
      description: ''
      x-ms-summary: ''
    notaryJournalList:
      type: object
      properties:
        endPosition:
          description: 'The last index position in the result set. '
          type: string
        nextUri:
          description: 'The URI for the next chunk of records based on the search request. It is `null` if this is the last set of results for the search. '
          type: string
        notaryJournals:
          description: ''
          type: array
          items:
            $ref: '#/components/schemas/notaryJournal'
        previousUri:
          description: 'The URI for the prior chunk of records based on the search request. It is `null` if this is the first set of results for the search. '
          type: string
        resultSetSize:
          description: The number of results in this response. Because you can filter which entries are included in the response, this value is always less than or equal to the `totalSetSize`.
          type: string
        startPosition:
          description: The starting index position of the current result set.
          type: string
        totalSetSize:
          description: The total number of items in the result set. This value is always greater than or equal to the value of `resultSetSize`.
          type: string
      x-ds-definition-name: notaryJournalList
      description: ''
      x-ms-summary: ''
    errorDetails:
      description: This object describes errors that occur. It is only valid for responses and ignored in requests.
      type: object
      properties:
        errorCode:
          description: The code associated with the error condition.
          type: string
        message:
          description: A brief message describing the error condition.
          type: string
      x-ds-definition-name: errorDetails
      x-ms-summary: This object describes errors that occur. It is only valid for responses and ignored in requests.
    jurisdiction:
      type: object
      properties:
        allowSystemCreatedSeal:
          description: When **true,** the seal can be generated by the platform.
          type: string
        allowUserUploadedSeal:
          description: When **true,** the seal can be uploaded by the user.
          type: string
        commissionIdInSeal:
          description: When **true,** the notary's `comissionId` appears in the seal.
          type: string
        county:
          description: The county of the jurisdiction.
          type: string
        countyInSeal:
          description: When **true,** the county name appears in the seal.
          type: string
        enabled:
          description: When **true,** this jurisdiction is enabled.
          type: string
        jurisdictionId:
          description: 'The ID of the jurisdiction.

            The following jurisdictions

            are supported:


            -  `5 - California`

            -  `6 - Colorado`

            -  `9 - Florida`

            -  `10 - Georgia`

            -  `12 - Idaho`

            -  `13 - Illinois`

            -  `14 - Indiana`

            -  `15 - Iowa`

            -  `17 - Kentucky`

            -  `23 - Minnesota`

            -  `25 - Missouri`

            -  `30 - New Jersey`

            -  `32 - New York`

            -  `33 - North Carolina`

            -  `35 - Ohio`

            -  `37 - Oregon`

            -  `38 - Pennsylvania`

            -  `40 - South Carolina`

            -  `43 - Texas`

            -  `44 - Utah`

            -  `47 - Washington`

            -  `48 - West Virginia`

            -  `49 - Wisconsin`

            -  `62 - Florida Commissioner of Deeds`

            '
          type: string
        name:
          description: The name of the jurisdiction. Typically the state name.
          type: string
        notaryPublicInSeal:
          description: When **true,** the name of the notary appears in the seal.
          type: string
        stateNameInSeal:
          description: When **true,** the name of the state appears in the seal.
          type: string
      description: 'Describes the jurisdiction of a notary.

        This is read-only object.'
      x-ds-definition-name: jurisdiction
      x-ms-summary: 'Describes the jurisdiction of a notary.

        This is read-only object.'
