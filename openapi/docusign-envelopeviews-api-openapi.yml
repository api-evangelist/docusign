      - description: 'The response contains the URL

          of the embeddable edit view

          for a specified envelope.


          The request body contains

          a `returnUrl`.

          This is the URL

          that the Docusign platform

          will redirect the user to

          when the view is closed.


          '
        direction: both
        format: json
        response:
          url: https://demo.docusign.net/Member/StartInSession.aspx?StartConsole=1&t=c8dc7c1e-xxxx-xxxx-xxxx-405ba1f7d38b&DocuEnvelope=4b728be4-xxxx-xxxx-xxxx-d63e23f822b6&send=1
        request:
          returnUrl: https://dsapp.example.com/return/from/edit/view
        style: custom
        title: Getting an Edit View URL and Setting a Return URL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/envelopeViewRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/envelopeViewRequest'
  /v2.1/accounts/{accountId}/envelopes/{envelopeId}/views/recipient:
    parameters: []
    post:
      tags:
      - EnvelopeViews
      summary: Returns a URL to the recipient view UI.
      description: 'Returns a URL that enables you to

        embed the recipient view

        of the

        DocuSign UI in your applications. If the recipient is a signer,

        then the view will provide the signing ceremony. This method is only used with envelopes in the `sent` status. Due to screen space issues,

        do not use an <iframe> for embedded operations on mobile devices. For iOS devices, Docusign recommends using a WebView. ### The returned URL


        The URL returned in this method''s response is intended to be used

        immediately to redirect the signer to the recipient view. You can open the recipient view

        in the current browser or in a new tab. After the signer is redirected to the

        recipient view, they must interact with the Docusign system

        periodically or their session will time out. The returned URL can be used only once and

        expires after 5 minutes. Do not store or email the returned URL. If you want to invite someone to an embedded signing session via

        email, the email invitation''s URL must be to your application. When invoked, your app should request a `recipientView` URL from

        Docusign and then redirect the signer to that URL. ### How to specify the default language


        You can append the `locale`

        query parameter

        to the URL returned by this method

        to specify a language. The language for the recipient view

        follows this order or precedence:


        - The language specified by the sender for the recipient. - The `locale` parameter appended to the URL. - The account language if the signer has a Docusign account. - The language used in a previous signing if the signer is return signer. - The browser language. For example, to set the default language

        to Canadian French, you would add this query parameter

        to the returned URL:


        ```

        ...&locale=fr_CA

        ```


        ## Authentication


        Your application is responsible for authenticating the identity

        of the recipient or signer when you use this method. Use the

        following parameters to record how the recipient

        was authenticated. - `assertionId`

        - `authenticationInstant`

        - `authenticationMethod`

        - `clientUserId`

        - `securityDomain`


        At a minimum, `authenticationMethod` and `clientUserId` are

        required. The information that you provide is included in the

        envelope''s certificate of completion. ## Sending to a remote signer


        You can request a signing session for a remote recipient

        who has a Docusign account. Authenticate the request using the recipient''s

        credentials, and do not specify a `clientUserId`. This differs from the typical behavior where the

        request is authenticated using the sender''s credentials,

        and the recipient has a `clientUserId` defined. ## Redirecting back to returnUrl

        After the signer completes or ends the signing ceremony, Docusign

        redirects the user''s browser back to your app via the

        `returnUrl` that you supplied in the request. The signer may be redirected through various Docusign

        subdomains, depending on the region of the account sending the

        envelope. Please consult Allowlists for Docusign eSignature service

        in **Security for Docusign eSignature**

        when setting up your allowlists


        ### The event status parameter


        Docusign appends an `event` query parameter to the `returnUrl` with the

        outcome of the signing ceremony. Your app can use this event

        parameter to determine the next step for the envelope. Do not fetch the envelope status by using

        Envelopes: get

        or a similar method because doing so

        will probably hit request and polling limits. | event query parameter | Meaning |

        | :------------------- | :--------------------------------------------------------------------------------------- |

        | signing_complete | The recipient has signed the document. |

        | cancel | The recipient decided to finish later. |

        | decline | The recipient declined to sign the document. |

        | exception | An exception has occurred on the server during the signing session. |

        | fax_pending | Recipient has a fax pending. |

        | session_timeout | The recipient did not sign the document in time. The timeout is set to 20 minutes.'
      operationId: Views_PostEnvelopeRecipientView
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: The ID of the draft envelope or template to preview.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeViews'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createRecipientView
      x-ds-method: createRecipient
      x-ds-service: Envelopes
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/recipientViewRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/recipientViewRequest'
  /v2.1/accounts/{accountId}/envelopes/{envelopeId}/views/sender:
    parameters: []
    post:
      tags:
      - EnvelopeViews
      summary: Returns a URL to the sender view UI. Used before an envelope has been sent
      description: 'Returns a URL that enables you to embed the envelope sender view of the Docusign UI. You can customize the appearance of the view via the settings request attribute. You can embed the view in an iframe. **API request update**


        The request object for this API method was updated in June 2024. The new API request format is described below. Existing applications must update to the new version; it solves a security issue with the old version. The deprecation schedule has been announced in the Docusign Core Release Notes. While backwards compatibility will be provided for a while for existing applications, all applications must be updated to be secure. See below for migration information. **Best practices**


        The returned URL expires after 10 minutes. Therefore, request the URL immediately before you redirect your user to it. Due to screen space issues, do not use an iframe for embedded operations on mobile devices. For mobile applications, use a WebView (Android) or WKWebView (iOS). ## Customizing the user experience


        By default, the view includes two pages: the **Prepare** and **Tagger** pages. The settings object is used to control the user experience. For example, to limit the user to the **Tagger** page, and not allow the user to change the recipient information:


        * `"startingScreen": "Tagger"`

        * `"showBackButton": "false"`

        * `"showEditRecipients": "false"`


        Use the Embedded Views Test Too to try the different UX controls. Some UI settings attributes are not yet implemented. ### The envelope must be in the correct state for the Embedded View


        To use the Sender View, the envelope **must** be in the `created` state. Otherwise, a 400 error will be returned with an error message in the response body:

        ```

        {

        "errorCode": "ENVELOPE_INVALID_STATUS",

        "message": "Invalid envelope status. Sender view cannot be created for an envelope that is not in a draft state."

        }

        ```


        ### Closing the view''s iframe


        If you choose to embed the view in your application via an iframe, Docusign recommends this software pattern to close the iframe after the view has completed:


        * (One time) create a standalone “return” page that you will use as the `returnUrl` target for the view. The view will redirect the iframe to this URL when it has completed. Here''s an example return page. In this page, use JavaScript and the postMessage method to send a message to your application with the results of the view. * In your application, use `window.addEventListener("message", function_name)` to register a listener for incoming messages. * To show the view, use this API method, then set the iframe to load the URL from the API response. * In your application, receive the completion message, validate it, and then close the iframe. ### Information security


        This view only has write access to the specific envelope referenced in the API call. It also has read access to templates and other secondary information that a user can access to modify the envelope. The read access corresponds to the access rights of the user associated with the access token used for the API call. >**Recommendations:**

        >* Use the access token of a service user who can access the templates appropriate for your use case. >* Do not use the access token of a user with administrator privileges. ## Migrating to the current version of the request object


        This section only applies to existing applications that use the older version of the request object. Migrating from the old API request object to the new version will take under a day of developer time. **Step 1.** Does your application set the `returnUrl` attribute? Yes: continue with step 2. No: In this case, your users first update the envelope, and then the Docusign eSignature home screen is shown. To accomplish this UI pattern with the new API request format:

        * Set the `returnUrl` to a new endpoint for your application. You can use query parameters or session data to manage state. Remember to authenticate the incoming requests.'
      operationId: Views_PostEnvelopeSenderView
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeViews'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createSenderView
      x-ds-method: createSender
      x-ds-service: Envelopes
      x-ds-in-sdk: true
      requestBody:
        content:
