openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Envelope Views API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: EnvelopeViews
  description: 'Provides a URL that you can embed in your application

    to provide access to the Docusign UI.


    ### Related topics


    - Embedded signing and sending

    - How to send an envelope via your app

    - Introducing customizable embedded sending'
paths:
  /v2.1/accounts/{accountId}/envelopes/{envelopeId}/views/correct:
    parameters: []
    post:
      tags:
      - EnvelopeViews
      summary: Returns a URL to the envelope correction UI. Use after an envelope has been sent
      description: "Returns a URL that enables you to embed the envelope sender view of the Docusign UI. You can customize the appearance of the view via the settings request attribute. You can embed the view in an iframe. **API request update**\n\nThe request object for this API method was updated in June 2024. The new API request format is described below. Existing applications must update to the new version; it solves a security issue with the old version. The deprecation schedule has been announced in the Docusign Core Release Notes. While backwards compatibility will be provided for a while for existing applications, all applications must be updated to be secure. See below for migration information. **Best practices**\n\nThe returned URL expires after 10 minutes. Therefore, request the URL immediately before you redirect your user to it. Due to screen space issues, do not use an iframe for embedded operations on mobile devices. For mobile applications, use a WebView (Android) or WKWebView (iOS). ## Customizing the user experience\n\nBy default, the view includes two pages: the **Prepare** and **Tagger** pages. The settings object is used to control the user experience. For example, to limit the user to the **Tagger** page, and not allow the user to change the recipient information:\n\n* `\"startingScreen\": \"Tagger\"`\n* `\"showBackButton\": \"false\"`\n* `\"showEditRecipients\": \"false\"`\n\nUse the Embedded Views Test Too to try the different UX controls. Some UI settings attributes are not yet implemented. ### The envelope must be in the correct state for the Embedded View\n\nTo use the Correct View, the envelope **must** be in the `sent` or `delivered` state. Otherwise, a 400 error will be returned with an error message in the response body:\n```\n{\n\"errorCode\": \"ENVELOPE_INVALID_STATUS\",\n\"message\": \"Invalid envelope status. Correct view cannot be created for an envelope in a Created state.\"\n}\n```\n\n### Modifying the envelope after redirection\nIf you set `\"sendButtonAction\": \"redirect\"` or `\"backButtonAction\": \"redirect\"`, and your app will modify the envelope before or after the view completes, you must lock the envelope before the API call and provide the lock as the lockToken attribute in the API request object. Delete the lock token after the browser has been redirected to your application. ### Closing the view's iframe\n\nIf you choose to embed the view in your application via an iframe, Docusign recommends this software pattern to close the iframe after the view has completed:\n\n* (One time) create a standalone â\x80\x9Creturnâ\x80\x9D page that you will use as the `returnUrl` target for the view. The view will redirect the iframe to this URL when it has completed. Here's an example return page. In this page, use JavaScript and the postMessage method to send a message to your application with the results of the view. * In your application, use `window.addEventListener(\"message\", function_name)` to register a listener for incoming messages. * To show the view, use this API method, then set the iframe to load the URL from the API response. * In your application, receive the completion message, validate it, and then close the iframe. ### Information security\n\nThis view only has write access to the specific envelope referenced in the API call. It also has read access to templates and other secondary information that a user can access to modify the envelope. The read access corresponds to the access rights of the user associated with the access token used for the API call. >**Recommendations:**\n>* Use the access token of a service user who can access the templates appropriate for your use case. >* Do not use the access token of a user with administrator privileges. ## Migrating to the current version of the request object\n\nThis section only applies to existing applications that use the older version of the request object. Migrating from the old API request object to the new version will take under a day of developer time."
      operationId: Views_PostEnvelopeCorrectView
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeViews'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createCorrectView
      x-ds-method: createCorrect
      x-ds-service: Envelopes
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/envelopeViewRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/envelopeViewRequest'
    delete:
      tags:
      - EnvelopeViews
      summary: Revokes the correction view URL to the Envelope UI
      operationId: Views_DeleteEnvelopeCorrectView
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: envelopeId
        in: path
        description: "The envelope's GUID. \n\nExample: `93be49ab-xxxx-xxxx-xxxx-f752070d71ec`\n"
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteEnvelopeCorrectView
      description: This API method is obsolete. Your application should not call it. It acts as a null operation.
      x-ds-method: deleteEnvelopeCorrectView
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/correctViewRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/correctViewRequest'
