              schema:
                $ref: '#/components/schemas/EnvelopeViews'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createConsoleView
      x-ds-method: createConsole
      x-ds-service: Envelopes
      x-ds-in-sdk: true
      x-ds-examples:
      - description: 'The response contains the URL

          of the account''s console.


          The request body contains

          a `returnUrl`.

          This is the URL

          that the Docusign platform

          will redirect the user to

          when the view is closed.


          '
        direction: both
        format: json
        response:
          url: https://demo.docusign.net/Member/StartInSession.aspx?StartConsole=1&t=644ea697-xxxx-xxxx-xxxx-d95a5c23340b&accountid=624e3e00-xxxx-xxxx-xxxx-43918c520dab
        request:
          returnUrl: https://dsapp.example.com/return/from/console/view
        style: custom
        title: Getting a Console View URL and Setting a Return URL
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/consoleViewRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/consoleViewRequest'
components:
  schemas:
    envelopeViewTaggerSettings:
      type: object
      properties:
        paletteDefault:
          description: "When `paletteSections` is set to `custom`, this property selects the default tagger palette. \nValid values:  \n* `custom`\n* `merge`\n* `notary`\n* `seals`\n* `smartContracts`\n* `annotations`\n* `smartSections`"
          type: string
        paletteSections:
          description: 'Valid values:


            * `default` (default): The default tagger palette UX

            * `none`: No tagger palette

            * `custom`: Set by `paletteDefault`'
          type: string
        paletteSettings:
          $ref: '#/components/schemas/paletteSettings'
          description: Reserved for Docusign.
      x-ds-definition-name: envelopeViewTaggerSettings
      description: ''
      x-ms-summary: ''
    recipientTokenClientURLs:
      type: object
      properties:
        onAccessCodeFailed:
          description: ''
          type: string
        onCancel:
          description: ''
          type: string
        onDecline:
          description: ''
          type: string
        onException:
          description: ''
          type: string
        onFaxPending:
          description: ''
          type: string
        onIdCheckFailed:
          description: ''
          type: string
        onSessionTimeout:
          description: ''
          type: string
        onSigningComplete:
          description: ''
          type: string
        onTTLExpired:
          description: ''
          type: string
        onViewingComplete:
          description: ''
          type: string
      x-ds-definition-name: recipientTokenClientURLs
      description: ''
      x-ms-summary: ''
    correctViewRequest:
      type: object
      properties:
        beginOnTagger:
          description: ''
          type: string
        returnUrl:
          description: '(Required) The URL to which the user should be redirected after

            the view session has ended.


            Maximum Length: 470 characters. If the `returnUrl` exceeds this

            limit, the user is redirected to a truncated URL

            Be sure to include `https://` in the URL

            or redirecting might fail on some browsers.


            When Docusign redirects to

            this URL, it will include an `event` query parameter that your app can use:


            * `send`: User corrected and sent the envelope.

            * `save`: User saved the envelope.

            * `cancel`: User canceled the transaction.

            * `error`: There was an error when performing the correct or send.

            * `sessionEnd`: The session ended before the user completed a different action.

            '
          type: string
        suppressNavigation:
          description: Specifies whether the window is displayed with or without dressing.
          type: string
        viewUrl:
          description: ''
          type: string
      description: 'The request body for the [EnvelopeViews: createCorrect](/docs/esign-rest-api/reference/envelopes/envelopeviews/createcorrect/) method.'
      x-ds-definition-name: correctViewRequest
      x-ms-summary: 'The request body for the [EnvelopeViews: createCorrect](/docs/esign-rest-api/reference/envelopes/envelopeviews/createcorrect/) method.'
    EnvelopeViews:
      type: object
      properties:
        url:
          description: The view URL to be navigated to.
          type: string
      x-ds-definition-name: viewUrl
      description: 'Provides a URL that you can embed in your application

        to provide access to the Docusign UI.


        ### Related topics


        - [Embedded signing and sending](/docs/esign-rest-api/esign101/concepts/embedding/)

        - [Send an envelope via your app](/docs/esign-rest-api/how-to/embedded-sending/)

        - [Introducing customizable embedded sending](https://www.docusign.com/blog/developers/introducing-customizable-embedded-sending)


        '
      x-ds-category: Envelopes
      x-ds-order: '1'
      x-ms-summary: 'Provides a URL that you can embed in your application

        to provide access to the Docusign UI.


        ### Related topics


        - [Embedded signing and sending](/docs/esign-rest-api/esign101/concepts/embedding/)

        - [Send an envelope via your app](/docs/esign-rest-api/how-to/embedded-sending/)

        - [Introducing customizable embedded sending](https://www.docusign.com/blog/developers/introducing-customizable-embedded-sending)


        '
    recipientViewRequest:
      type: object
      properties:
        assertionId:
          description: A unique identifier of the authentication event executed by the client application.
          type: string
        authenticationInstant:
          description: A sender-generated value that indicates the date and time that the signer was authenticated.
          type: string
        authenticationMethod:
          description: "Required. Choose a value that most closely matches the technique your application used to authenticate the recipient / signer. \n\nChoose a value from this list: \n* Biometric \n* Email\n* HTTPBasicAuth\n* Kerberos\n* KnowledgeBasedAuth\n* None\n* PaperDocuments\n* Password\n* RSASecureID\n* SingleSignOn_CASiteminder\n* SingleSignOn_InfoCard\n* SingleSignOn_MicrosoftActiveDirectory\n* SingleSignOn_Other\n* SingleSignOn_Passport\n* SingleSignOn_SAML\n* Smartcard\n* SSLMutualAuth\n* X509Certificate\n\nThis information is included in the Certificate of Completion."
