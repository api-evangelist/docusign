openapi: 3.2.0
info:
  version: v2.1
  title: Docusign eSignature REST Billing Plans API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: Billing Plans
  description: The Billing resource provides methods that allow you to manage the billing plans associated with an account.
paths:
  /v2.1/accounts/{accountId}/billing_plan:
    parameters: []
    get:
      tags:
      - Billing Plans
      summary: Get Account Billing Plan
      description: 'Retrieves the billing plan information for the specified account, including the current billing plan, successor plans, billing address, and billing credit card.


        By default the successor plan and credit card information is included in the response. You can exclude this information from the response by adding the appropriate optional query string and setting it to **false.**


        Response


        The response returns the billing plan information, including the currency code, for the plan. The `billingPlan` and `succesorPlans` property values are the same as those shown in the Billing: getBillingPlan reference. the `billingAddress` and `creditCardInformation` property values are the same as those shown in the Billing: updatePlan reference.


        **Note:** When credit card number information displays, a mask is applied to the response so that only the last 4 digits of the card number are visible.'
      operationId: BillingPlan_GetBillingPlan
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: include_credit_card_information
        in: query
        description: When **true,** payment information including credit card information will show in the return.
        required: false
        schema:
          type: string
      - name: include_downgrade_information
        in: query
        required: false
        description: ''
        schema:
          type: string
      - name: include_metadata
        in: query
        description: 'When **true,** the `canUpgrade` and `renewalStatus` properties are included the response and an array of `supportedCountries` is added to the `billingAddress` information. '
        required: false
        schema:
          type: string
      - name: include_successor_plans
        in: query
        description: When **true,** excludes successor information from the response.
        required: false
        schema:
          type: string
      - name: include_tax_exempt_id
        in: query
        required: false
        description: ''
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/accountBillingPlanResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getPlan
      x-ds-method: getAccountPlan
      x-ds-service: Billing
      x-ds-in-sdk: true
    put:
      tags:
      - Billing Plans
      summary: Updates an account billing plan
      description: Updates the billing plan information, billing address, and credit card information for the specified account.
      operationId: BillingPlan_PutBillingPlan
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: preview_billing_plan
        in: query
        description: When **true,** updates the account using a preview billing plan.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingPlanUpdateResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updatePlan
      x-ds-method: update
      x-ds-service: Billing
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/billingPlanInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/billingPlanInformation'
  /v2.1/accounts/{accountId}/billing_plan/credit_card:
    parameters: []
    get:
      tags:
      - Billing Plans
      summary: Get credit card information
      operationId: BillingPlan_GetCreditCardInfo
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/creditCardInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getCreditCardInfo
      description: This method returns information about a credit card associated with an account.
      x-ds-method: getCreditCard
      x-ds-service: Billing
      x-ds-in-sdk: true
  /v2.1/accounts/{accountId}/billing_plan/downgrade:
    parameters: []
    get:
      tags:
      - Billing Plans
      summary: Returns downgrade plan information for the specified account
      operationId: BillingPlan_GetDowngradeRequestBillingInfo
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/downgradRequestBillingInfoResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getDowngradeRequestBillingInfo
      description: ''
      x-ds-method: getDowngradeRequestBillingInfo
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
    put:
      tags:
      - Billing Plans
      summary: Queues downgrade billing plan request for an account
      operationId: BillingPlan_PutDowngradeAccountBillingPlan
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/downgradePlanUpdateResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateDowngradeAccountBillingPlan
      description: ''
      x-ds-method: updateDowngradeAccountBillingPlan
      x-ds-service: Uncategorized
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/downgradeBillingPlanInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/downgradeBillingPlanInformation'
  /v2.1/accounts/{accountId}/billing_plan/purchased_envelopes:
    parameters: []
    put:
      tags:
      - Billing Plans
      summary: 'Reserved: Purchase additional envelopes'
      description: 'Reserved: At this time, this endpoint is limited to Docusign internal use only. Completes the purchase of envelopes for your account. The actual purchase is done as part of an internal workflow interaction with an envelope vendor.'
      operationId: PurchasedEnvelopes_PutPurchasedEnvelopes
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: purchaseEnvelopes
      x-ds-method: purchaseEnvelopes
      x-ds-service: Billing
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/purchasedEnvelopesInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/purchasedEnvelopesInformation'
  /v2.1/billing_plans:
    parameters: []
    get:
      tags:
      - Billing Plans
      summary: Gets a list of available billing plans
      description: Retrieves a list of the billing plans associated with a distributor.
      operationId: BillingPlans_GetBillingPlans
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingPlansResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: listBillingPlans
      x-ds-method: list
      x-ds-service: Billing
      x-ds-in-sdk: true
  /v2.1/billing_plans/{billingPlanId}:
    parameters: []
    get:
      tags:
      - Billing Plans
      summary: Gets billing plan details
      description: Retrieves the billing plan details for the specified billing plan ID.
      operationId: BillingPlans_GetBillingPlan
      parameters:
      - name: billingPlanId
        in: path
        description: The ID of the billing plan being accessed.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/billingPlanResponse'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: getBillingPlan
      x-ds-method: get
      x-ds-service: Billing
      x-ds-in-sdk: true
