          example: 00000000-0000-0000-0000-000000000000
        site_id:
          type: integer
          description: ''
          format: int32
        url:
          type: string
          description: ''
        number_processed_accounts:
          type: integer
          description: ''
          format: int64
        error_details:
          $ref: '#/components/schemas/OASIRR_ErrorDetails'
        processing_issues_by_account:
          type: array
