          format: date-time
        percent_completed:
          type: integer
          description: ''
          format: int32
        number_processed_accounts:
          type: integer
          description: ''
          format: int64
        number_unprocessed_accounts:
          type: integer
          description: ''
          format: int64
        results:
          type: array
          description: ''
          items:
            $ref: '#/components/schemas/OrganizationAccountSettingsImportResultResponse'
        success:
          type: boolean
          description: ''
        skipped_settings_by_account:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
