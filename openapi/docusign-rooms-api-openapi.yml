  /v2/accounts/{accountId}/rooms/{roomId}/picture:
    put:
      tags:
      - Rooms
      summary: Docusign Updates the picture for a room.
      description: "Updates the photo for a room.\nThe image file size limit is approximately 40 MB,\nand you can use the following image formats:\n\n- jpg/jpeg\n- png\n- tiff\n- gif\n\n\nIn the request body of this endpoint,\nyou can specify the image as:\n\n- a JSON object\n- multipart form data\n- stream data\n\nTo upload an image as a JSON object,\nuse an object with two string properties:\n- `fileName`: the name of the file\n- `base64Contents`: the base64 representation of the image.\nFor example a cURL request might look like this:\n\n```bash\ncurl --request PUT '/restapi/v2/accounts/{accountId}/rooms/{roomId}/picture' \\\n     --header 'Content-Type: application/json' \\\n     --data-raw '{\n                   \"fileName\":\"name-of-file.jpg\",\n                   \"base64Contents\":\"iVBOR...RK3IAK5CYII=\"\n                 }'\n```\n\nUsing multipart form data removes the need to encode images in base64 format.\nSee _Multipart form requests_ in [Formatting API requests](/docs/esign-rest-api/esign101/rules-and-limits/requests/)\nfor details and an example.\n\nTo use other other streamed binary content types,\nuse the `Content-Disposition`  request header.\n\n```\nContent-Disposition: file; filename=\"hello.jpg\"\n```\n"
      operationId: Rooms_UpdatePicture
      parameters:
      - name: roomId
        in: path
        description: The ID of the room.
        required: true
        schema:
          type: integer
          format: int32
      - name: accountId
        in: path
        description: The globally unique identifier (GUID) for the account.
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  description: File to be uploaded
                  format: binary
      responses:
        '200':
          description: Picture successfully updated.
          content:
            application/json:
              schema:
