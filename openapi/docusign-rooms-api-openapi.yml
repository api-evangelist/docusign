      summary: Docusign Returns a list of rooms.
      description: 'This method returns details about the rooms that the current user has permissions to view.


        The `fieldDataChangedStartDate` and `fieldDataChangedEndDate`

        query parameters let you limit the results to rooms

        whose [field data](/docs/rooms-api/reference/rooms/rooms/getroomfielddata/) has changed within a range of dates.


        The `roomClosedStartDate` and `roomClosedEndDate` query parameters let you limit the results to rooms that were closed within a range of dates.


        **Note:** By default, this method only returns open rooms. To return other rooms, use the `roomStatus` query parameter.'
      operationId: Rooms_GetRooms
      parameters:
      - name: count
        in: query
        description: The number of results. When this property is used as a request parameter specifying the number of results to return, the value must be a number between 1 and 100 (default).
