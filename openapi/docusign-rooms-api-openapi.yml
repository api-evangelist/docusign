        schema:
          type: integer
          format: int32
      - name: fieldDataChangedStartDate
        in: query
        description: 'Starting date and time to filter rooms whose field data has changed after this date. Date and time is always given as UTC. If the time (`hh:mm:ss`) is omitted, it defaults to `00:00:00`.


          Valid formats:


          - `yyyy-mm-dd hh:mm:ss`

          - `yyyy/mm/dd hh:mm:ss`


          The default start date is the beginning of time.

          '
