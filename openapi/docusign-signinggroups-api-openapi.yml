info:
  version: v2.1
  title: Docusign eSignature REST Signing Groups API
  description: The Docusign eSignature REST API provides you with a powerful, convenient, and simple Web services API for interacting with Docusign.
  termsOfService: https://www.docusign.com/company/terms-and-conditions/web
  contact:
    name: Docusign Developer Center
    url: https://developers.docusign.com/
    email: devcenter@docusign.com
servers:
- url: https://www.docusign.net/restapi
tags:
- name: SigningGroups
  description: 'The SigningGroups resource provides methods that enable you to manage signing groups.


    Signing groups enable you to create a group of people to which an envelope is sent. Any member of that group can open an envelope and sign the documents in the envelope with their own signature, even though a signature field was not directly assigned to them. When the signing group option is used, group members that open and sign the envelope are tracked in the envelope history and certificate.


    When one group member opens the envelope, it is temporarily locked and if other members try to open the envelope they will see a message saying the envelope is currently opened. If the group member exits the envelope without finishing the lock expires, allowing other group members to open and complete the envelope.


    When the envelope is complete, all members of the group will receive a completed notification and can access the completed envelope.

    The envelope history and Certificate of Completion will show that the envelope was sent to a signing group and record which members viewed and signed the envelope.


    An account can have a maximum of 50 signing groups. Each signing group can have a maximum of 50 group members.


    The signing groups feature is only supported in certain Docusign Enterprise and System Automated Premium plans. To access this functionality, contact your Account Manager or Docusign Support (support@docusign.com) for assistance.


    Next steps:

    * Learn how to create a signing group via the API.

    * Learn how to request a signature from a signing group.'
paths:
  /v2.1/accounts/{accountId}/signing_groups:
    parameters: []
    get:
      tags:
      - SigningGroups
      summary: Gets a list of the Signing Groups in an account
      description: Retrieves a list of all signing groups in the specified account.
      operationId: SigningGroups_GetSigningGroups
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: group_type
        in: query
        required: false
        description: 'Filters by the type of signing group. Valid values:

          * `sharedSigningGroup`

          * `privateSigningGroup`

          * `systemSigningGroup`'
        schema:
          type: string
      - name: include_users
        in: query
        description: 'When **true,** the response includes the signing group members. '
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signingGroupInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: list
      x-ds-method: list
      x-ds-service: SigningGroups
      x-ds-in-sdk: true
    put:
      tags:
      - SigningGroups
      summary: Updates signing group names
      description: Updates the name of one or more existing signing groups.
      operationId: SigningGroups_PutSigningGroups
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signingGroupInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: updateList
      x-ds-method: updateList
      x-ds-service: SigningGroups
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signingGroupInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/signingGroupInformation'
    post:
      tags:
      - SigningGroups
      summary: Creates a signing group
      description: 'Creates one or more signing groups.


        Multiple signing groups can be created in one call. Only users with account administrator privileges can create signing groups.


        An account can have a maximum of 50 signing groups. Each signing group can have a maximum of 50 group members.


        Signing groups can be used by any account user.'
      operationId: SigningGroups_PostSigningGroups
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signingGroupInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: createList
      x-ds-method: create
      x-ds-service: SigningGroups
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signingGroupInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/signingGroupInformation'
    delete:
      tags:
      - SigningGroups
      summary: Deletes one or more signing groups
      description: Deletes one or more signing groups in the specified account.
      operationId: SigningGroups_DeleteSigningGroups
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signingGroupInformation'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: deleteList
      x-ds-method: delete
      x-ds-service: SigningGroups
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signingGroupInformation'
          application/xml:
            schema:
              $ref: '#/components/schemas/signingGroupInformation'
  /v2.1/accounts/{accountId}/signing_groups/{signingGroupId}:
    parameters: []
    get:
      tags:
      - SigningGroups
      summary: Gets information about a signing group
      description: Retrieves information, including group member information, for the specified signing group.
      operationId: SigningGroups_GetSigningGroup
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: signingGroupId
        in: path
        required: true
        description: 'The ID of the [signing group](https://support.docusign.com/s/document-item?bundleId=gav1643676262430&topicId=zgn1578456447934.html).

          '
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signingGroup'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: get
      x-ds-method: get
      x-ds-service: SigningGroups
      x-ds-in-sdk: true
    put:
      tags:
      - SigningGroups
      summary: Updates a signing group
      description: Updates signing group name and member information. You can also add new members to the signing group. A signing group can have a maximum of 50 members.
      operationId: SigningGroups_PutSigningGroup
      parameters:
      - name: accountId
        in: path
        description: The external account number (int) or account ID GUID.
        required: true
        schema:
          type: string
      - name: signingGroupId
        in: path
        required: true
        description: 'The ID of the [signing group](https://support.docusign.com/s/document-item?bundleId=gav1643676262430&topicId=zgn1578456447934.html).

          '
        schema:
          type: string
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/signingGroup'
        '400':
          description: Error encountered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/errorDetails'
      deprecated: false
      x-ds-methodname: update
      x-ds-method: update
      x-ds-service: SigningGroups
      x-ds-in-sdk: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/signingGroup'
          application/xml:
            schema:
              $ref: '#/components/schemas/signingGroup'
components:
  schemas:
    signingGroupInformation:
      type: object
      properties:
        groups:
          description: A collection group objects containing information about the groups.
          type: array
          items:
            $ref: '#/components/schemas/signingGroup'
      x-ds-definition-name: signingGroupInformation
      description: ''
      x-ms-summary: ''
    signingGroupUser:
      type: object
      properties:
        email:
          description: ''
          type: string
        errorDetails:
          $ref: '#/components/schemas/errorDetails'
          description: This object describes errors that occur. It is only valid for responses and ignored in requests.
        userName:
          description: "The name of the group member. \n\nMaximum Length: 100 characters. "
          type: string
      x-ds-definition-name: signingGroupUser
      description: ''
      x-ms-summary: ''
    signingGroup:
      type: object
      properties:
        created:
          description: The UTC DateTime when the signing group was created. This property is read-only.
          type: string
        createdBy:
          description: The name of the user who created the signing group. This property is read-only.
          type: string
        errorDetails:
          $ref: '#/components/schemas/errorDetails'
          description: This object describes errors that occur. It is only valid for responses and ignored in requests.
        groupEmail:
          description: The email address for the signing group. You can use a group email address to email all of the group members at the same time.
          type: string
        groupName:
          description: The name of the group.
          type: string
        groupType:
          description: The type of the group. The only valid value for this request is `sharedSigningGroup`.
          type: string
        modified:
          description: The UTC DateTime when the signing group was last modified. This property is read-only.
          type: string
        modifiedBy:
          description: The user ID (GUID) of the user who last modified this user record. This property is read-only.
          type: string
        signingGroupId:
          description: 'The ID of the [signing group](https://support.docusign.com/s/document-item?bundleId=gav1643676262430&topicId=zgn1578456447934.html).

            '
          type: string
        users:
          description: User management information.
          type: array
          items:
            $ref: '#/components/schemas/signingGroupUser'
      description: Contains details about a signing group. Signing groups enable you to send an envelope to a predefined group of recipients and have any one member of the group sign your documents. When you send an envelope to a signing group, anyone in the group can open it and sign it with their own signature.
      x-ds-definition-name: signingGroup
      x-ms-summary: Contains details about a signing group. Signing groups enable you to send an envelope to a predefined group of recipients and have any one member of the group sign your documents. When you send an envelope to a signing group, anyone in the group can open it and sign it with their own signature.
    errorDetails:
